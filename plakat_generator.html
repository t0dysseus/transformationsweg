<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plakat-Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--bd:#d9dce2;--ac:#2b6b9b;--acf:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;--ac:#5aa3d6;--acf:#0b1a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;--ac:#5aa3d6;--acf:#0b1a26;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button,select,.fbtn{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5}
label.l{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
textarea,input[type=text]{width:100%;font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
.sl{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.cols label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
details summary{cursor:pointer;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.stage{position:sticky;top:12px;align-self:start}
#cv{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.25);touch-action:none;cursor:grab;background:#fff}
#msg{font-size:13px;color:var(--mut);min-height:1.4em;text-align:center;margin-top:8px}
details.adv>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--fg)}
.adv h2{margin-top:18px}.adv[open]>summary{margin-bottom:4px}
.big{width:100%;padding:12px;font-size:16px;border-radius:12px}
#texts label.l:first-child{margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <div class="stage"><div class="chips" id="thm" style="justify-content:center;margin-bottom:10px"><button data-t="light">Hell</button><button data-t="dark">Dunkel</button></div><canvas id="cv"></canvas></div>
  <div>
    <div class="card"><h1>Plakat-Generator</h1><div id="texts"></div><div class="row"><button class="pri big" id="bPdf">PDF erstellen</button></div><div id="msg"></div></div>
    <details class="card adv"><summary>Erweiterte Möglichkeiten</summary>
      <h2>Verschieben und Größe</h2><div class="chips" id="chips"></div><div id="fields"></div>
      <h2>Schrift</h2><div class="row"><label style="font-size:12px;color:var(--mut)">Titel <select id="fT"><option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option><option value="Archivo Black">Archivo Black</option><option value="Arial">Arial</option></select></label>
      <label style="font-size:12px;color:var(--mut)">Text <select id="fB"><option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option><option value="Arial">Arial</option><option value="Archivo Black">Archivo Black</option></select></label></div>
      <h2>Farben</h2><div class="cols" id="cols"></div>
      <h2>Ausgabe</h2><div class="row"><label style="font-size:12px;color:var(--mut)">Format <select id="fmt"><option value="a5">A5</option><option value="a4" selected>A4</option><option value="a3">A3</option></select></label><label style="font-size:13px"><input type="checkbox" id="both"> Hell und Dunkel (2 Seiten)</label></div>
      <div class="row"><button id="bPng">PNG speichern</button><button id="bReset">Zurücksetzen</button></div>
    </details>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const adv=document.querySelector('details.adv');
const TH={
 light:{bg:'#ffffff',title:'#000000',sub:'#000000',dates:'#000000',claim:'#000000',base:'#000000',band:'#d4ecfc',footTx:'#000000',rib:'#111111',ribB:'#1ea0f0',logo:'#8fa3b5'},
 dark:{bg:'#15151a',title:'#ffffff',sub:'#ffffff',dates:'#ffffff',claim:'#ffffff',base:'#ffffff',band:'#16314a',footTx:'#ffffff',rib:'#e6e6ee',ribB:'#3cb0ff',logo:'#9fb8cc'}};
const CL={bg:'Hintergrund',title:'Titel',sub:'Untertitel',dates:'Termine',claim:'Claim',base:'Anmeldetext & Logo-Text',band:'Fußzeile Fläche',footTx:'Fußzeile Text',rib:'Bänder schwarz',ribB:'Band blau',logo:'Logo-Raster'};
const DEF=()=>({theme:'dark',fT:'Atkinson Hyperlegible',fB:'Atkinson Hyperlegible',fmt:'a4',both:false,sel:'title',
 tx:{title:'Hackathon',sub:'CJD Sickingen Straße',dates:'1.12.26\n5.12.26\n9.12.26',claim:'Dein CJD braucht deine Ideen!',cta:'Melde dich jetzt bei *Moodle* an und\nerfahre mehr über die *Themenauswahl*.',logo:'Räume\nfür Jeden',foot:'In Zusammenarbeit mit dem Masterstudiengang Transformation Design & Print der BHT'},
 pos:{title:{x:55.6,y:6,s:1},dates:{x:3.2,y:69.2,s:1},claim:{x:55.8,y:61.8,s:1},cta:{x:55.6,y:66.7,s:1},logo:{x:7.9,y:92.5,s:1},foot:{x:1.2,y:99.1,s:1},
  rib1:{x:0,y:0,s:1},rib2:{x:0,y:0,s:1},rib3:{x:0,y:0,s:1},rib4:{x:0,y:0,s:1}},
 th:JSON.parse(JSON.stringify(TH))});
let S=DEF();
try{const o4=localStorage.getItem('plakat-gen4'),j=JSON.parse(o4||localStorage.getItem('plakat-gen3')||localStorage.getItem('plakat-gen2')||'null');if(j&&!o4){delete j.fT;delete j.fB;delete j.theme;delete j.th}if(j){for(const k of['tx','pos','th'])for(const a in j[k]||{})if(S[k][a]!==undefined)S[k][a]=typeof j[k][a]==='object'?Object.assign(S[k][a],j[k][a]):j[k][a];for(const k of['theme','fT','fB','fmt','both'])if(j[k]!==undefined)S[k]=j[k]}}catch(e){}
const imgs={};
const save=()=>{try{const{sel,...r}=S;localStorage.setItem('plakat-gen4',JSON.stringify(r))}catch(e){}};
const fam=f=>f==='Arial'?'Arial,Helvetica,sans-serif':f==='Atkinson Hyperlegible'?'"Atkinson Hyperlegible",Arial,Helvetica,sans-serif':'"Archivo Black","Arial Black",Impact,sans-serif';
const F=(f,px,b)=>(f==='Archivo Black'?'400 ':(b?'700 ':'400 '))+px+'px '+fam(f);
const lines=t=>String(t).split('\n').map(s=>s.trim()).filter(Boolean);

// ---------- Drahtgitter-Bänder (Standardbänder), Maße im Plakatraster 810 x 1145 ----------
function spline(P,N,closed){
 const m=P.length,out=[],g=i=>closed?P[(i%m+m)%m]:P[Math.max(0,Math.min(m-1,i))],segs=closed?m:m-1;
 for(let k=0;k<N;k++){
  const t=(closed?k/N:k/(N-1))*segs,i=Math.min(Math.floor(t),segs-1),f=t-i,p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2),f2=f*f,f3=f2*f;
  out.push([0,1].map(d=>.5*(2*p1[d]+(-p0[d]+p2[d])*f+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*f2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*f3)));
 }
 return out;
}
const wAt=(w,t)=>{if(t<=w[0][0])return w[0][1];for(let i=1;i<w.length;i++)if(t<=w[i][0]){const q=(t-w[i-1][0])/(w[i][0]-w[i-1][0]),e=(1-Math.cos(Math.PI*q))/2;return w[i-1][1]+(w[i][1]-w[i-1][1])*e}return w[w.length-1][1]};
const ss=x=>{x=Math.min(1,Math.max(0,x+.5));return x*x*(3-2*x)};
function ribbon(c,d,col,lw){
 const cl=!!d.closed,N=cl?420:520,C=spline(d.pts,N,cl),n=C.length,NV=d.nv||8,dl=d.dl||.07;
 const Nm=[],Hh=[],L=[0];
 for(let i=0;i<n;i++){
  const a=C[cl?(i+n-1)%n:Math.max(i-1,0)],b=C[cl?(i+1)%n:Math.min(i+1,n-1)],tx=b[0]-a[0],ty=b[1]-a[1],m=Math.hypot(tx,ty)||1;
  Nm.push([-ty/m,tx/m]);
  const t=cl?i/n:i/(n-1),ph=Math.PI*d.tw.reduce((s,ti)=>s+ss((t-ti)/dl),0);
  Hh.push(wAt(d.w,t)*Math.cos(ph));
  if(i)L.push(L[i-1]+Math.hypot(C[i][0]-C[i-1][0],C[i][1]-C[i-1][1]));
 }
 const E=(i,v)=>[C[i][0]+Nm[i][0]*Hh[i]*v,C[i][1]+Nm[i][1]*Hh[i]*v];
 const cell=d.cell||7.5,st=[0];let next=cell;
 for(let i=1;i<n;i++)if(L[i]>=next){st.push(i);next+=cell}
 if(st[st.length-1]!==n-1)st.push(n-1);
 c.save();c.strokeStyle=col;c.lineJoin='round';c.lineCap='round';
 c.beginPath();
 for(const i of st){const a=E(i,-1),b=E(i,1);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1])}
 for(let j=1;j<NV;j++){const v=-1+2*j/NV;for(let i=0;i<n;i++){const e=E(i,v);i?c.lineTo(e[0],e[1]):c.moveTo(e[0],e[1])}}
 for(let s=0;s<st.length-1;s++)for(let j=0;j<NV;j++){const a=E(st[s],-1+2*j/NV),b=E(st[s+1],-1+2*(j+1)/NV);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1])}
 c.lineWidth=lw*.7;c.globalAlpha=.85;c.stroke();
 c.beginPath();
 for(const v of[-1,1])for(let i=0;i<n;i++){const e=E(i,v);i?c.lineTo(e[0],e[1]):c.moveTo(e[0],e[1])}
 c.lineWidth=lw*2.2;c.globalAlpha=1;c.stroke();
 c.restore();
}
// vier Standardbänder: schwarz (1–3) und blau (4); Bild-Upload ersetzt jedes einzelne
const RIB=[
 {pts:[[-30,95],[40,50],[95,28],[125,80],[112,190],[150,270],[230,340],[330,420],[420,495],[480,560],[505,600],[470,640],[390,650]],w:[[0,28],[.3,36],[.55,24],[.75,46],[1,32]],tw:[.4,.9]},
 {pts:[[-30,525],[40,470],[103,432],[125,500],[160,585],[230,632],[330,645],[450,625],[600,598],[720,550],[850,490]],w:[[0,40],[.35,26],[.6,22],[1,50]],tw:[.2,.78]},
 {pts:[[320,610],[300,670],[318,740],[370,830],[440,925],[525,1020],[620,1100],[740,1170],[830,1230]],w:[[0,34],[.5,40],[1,44]],tw:[.18]},
 {blue:1,pts:[[300,55],[395,95],[415,150],[340,185],[280,240],[275,330],[310,400],[380,430],[440,420],[455,360],[420,310],[460,265],[540,270],[590,320],[570,385],[600,430],[660,450],[640,510],[570,540],[490,560]],w:[[0,24],[.5,28],[1,26]],tw:[.2,.42,.65,.88],cell:6}
];
RIB.forEach(d=>{const xs=d.pts.map(p=>p[0]),ys=d.pts.map(p=>p[1]);d.c=[(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2]});
const LOGO={closed:true,pts:Array.from({length:12},(_,k)=>{const a=-Math.PI/2+k/12*Math.PI*2,r=38+7*Math.cos(3*(a+Math.PI/2));return[47+r*Math.cos(a),47+r*Math.sin(a)]}),w:[[0,9],[1,9]],tw:[.17,.5,.83],dl:.1,nv:5,cell:5};

function draw(c,W,H,tn,sel){
 const T=S.th[tn],u=W/810,B={};
 const txt=(s,x,y,col,fs)=>{c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y+fs*.04)};
 c.save();c.fillStyle=T.bg;c.fillRect(0,0,W,H);
 c.fillStyle=T.band;c.fillRect(0,H*.866,W,H*.134);
 c.beginPath();c.rect(0,0,W,H);c.clip();
 RIB.forEach((d,i)=>{
  const k='rib'+(i+1),p=S.pos[k],im=imgs[k];c.save();
  if(im){c.translate(p.x/100*W,p.y/100*H);c.scale(u*p.s,u*p.s);c.drawImage(im,0,0,810,810*im.height/im.width)}
  else{c.translate(p.x/100*W+d.c[0]*u,p.y/100*H+d.c[1]*u);c.scale(u*p.s,u*p.s);c.translate(-d.c[0],-d.c[1]);ribbon(c,d,d.blue?T.ribB:T.rib,.8)}
  c.restore();
 });
 c.restore();
 // Titel + Untertitel (linksbündig, y = Grundlinie des Titels)
 {const p=S.pos.title,s=u*p.s,cx=p.x/100*W,by=p.y/100*H,tx=S.tx.title||' ',ls=-.02;
  c.font=F(S.fT,100,true);const w100=[...tx].reduce((a,ch)=>a+c.measureText(ch).width,0)+ls*100*(tx.length-1),tw=354*s,fs=100*tw/Math.max(w100,1);
  c.font=F(S.fT,fs,true);c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=T.title;
  let x=cx;for(const ch of tx){c.fillText(ch,x,by);x+=c.measureText(ch).width+ls*fs}
  let bot=by+fs*.05;
  if(S.tx.sub){const f2=27*s;c.font=F(S.fB,f2,false);c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=T.sub;c.fillText(S.tx.sub,cx,by+49*s);bot=by+49*s+f2*.25}
  B.title=[cx,by-.72*fs,cx+Math.max(tw,0),bot]}
 // Termine
 {const p=S.pos.dates,Ls=lines(S.tx.dates),s=u*p.s,fs=62*s,pit=71*s,cx=p.x/100*W,cy=p.y/100*H;
  if(Ls.length){c.font=F(S.fT,fs,true);c.textAlign='left';c.textBaseline='middle';c.fillStyle=T.dates;let mw=0;
   Ls.forEach((l,i)=>{c.fillText(l,cx,cy+(i-(Ls.length-1)/2)*pit+fs*.04);mw=Math.max(mw,c.measureText(l).width)});
   B.dates=[cx,cy-(Ls.length-1)/2*pit-fs*.55,cx+mw,cy+(Ls.length-1)/2*pit+fs*.55]}}
 // Claim
 {const p=S.pos.claim,Ls=lines(S.tx.claim),s=u*p.s,fs=22*s,lh=27*s,cx=p.x/100*W,cy=p.y/100*H;
  if(Ls.length){c.font=F(S.fB,fs,true);c.textAlign='left';c.textBaseline='middle';c.fillStyle=T.claim;let mw=0;
   Ls.forEach((l,i)=>{c.fillText(l,cx,cy+(i-(Ls.length-1)/2)*lh+fs*.04);mw=Math.max(mw,c.measureText(l).width)});
   B.claim=[cx,cy-Ls.length*lh/2,cx+mw,cy+Ls.length*lh/2]}}
 // Anmeldetext: *Wort* wird fett
 {const p=S.pos.cta,Ls=String(S.tx.cta).split('\n').filter(l=>l.trim()),s=u*p.s,fs=17*s,lh=20.5*s,cx=p.x/100*W,cy=p.y/100*H;
  if(Ls.length){c.textAlign='left';c.textBaseline='middle';c.fillStyle=T.base;let mw=0;
   Ls.forEach((l,i)=>{const y=cy+(i-(Ls.length-1)/2)*lh+fs*.04;let x=cx;
    l.trim().split('*').forEach((t,j)=>{if(!t)return;c.font=F(S.fB,fs,j%2===1);c.fillText(t,x,y);x+=c.measureText(t).width});mw=Math.max(mw,x-cx)});
   B.cta=[cx,cy-Ls.length*lh/2,cx+mw,cy+Ls.length*lh/2]}}
 // Logo
 {const p=S.pos.logo,s=u*p.s,cx=p.x/100*W,cy=p.y/100*H,sz=94*s,im=imgs.logo;
  if(im){const iw=sz,ih=sz*im.height/im.width;c.drawImage(im,cx-iw/2,cy-ih/2,iw,ih);B.logo=[cx-iw/2,cy-ih/2,cx+iw/2,cy+ih/2]}
  else{c.save();c.translate(cx,cy);c.scale(s,s);c.translate(-47,-47);ribbon(c,LOGO,T.logo,.55);c.restore();
   const Ls=lines(S.tx.logo);if(Ls.length){const fs=9.5*s;c.font=F(S.fB,fs,true);Ls.forEach((l,i)=>txt(l,cx,cy+(i-(Ls.length-1)/2)*fs*1.25,T.base,fs))}
   B.logo=[cx-sz/2,cy-sz/2,cx+sz/2,cy+sz/2]}}
 // Fußzeile
 {const p=S.pos.foot,s=u*p.s,fs=9.5*s,cx=p.x/100*W,cy=p.y/100*H,t=S.tx.foot||'';
  if(t){c.font=F(S.fB,fs,false);c.textAlign='left';c.textBaseline='middle';c.fillStyle=T.footTx;c.fillText(t,cx,cy+fs*.04);const w=c.measureText(t).width;B.foot=[cx,cy-fs*.7,cx+w,cy+fs*.7]}}
 if(sel&&B[sel]){const[a,b,d,e]=B[sel],m=8*u;c.save();c.strokeStyle='#e5484d';c.lineWidth=Math.max(1.5,2*u);c.setLineDash([8*u,6*u]);c.strokeRect(a-m,b-m,d-a+2*m,e-b+2*m);c.restore()}
 return B;
}

const cv=$('#cv');let boxes={};
function render(){
 const r=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||560;cv.width=Math.round(w*r);cv.height=Math.round(w*r*1.41421);
 boxes=draw(cv.getContext('2d'),cv.width,cv.height,S.theme,adv.open?S.sel:null);save();
}
const msg=t=>$('#msg').textContent=t;
const ELS=[['title','Titel',[['title','Titel',1],['sub','Untertitel',1]]],['dates','Termine',[['dates','Termine, eine pro Zeile',3]]],['claim','Claim',[['claim','Text, Zeilenumbruch = neue Zeile',2]]],['cta','Anmeldetext',[['cta','Text, *Wort* wird fett',3]]],['logo','Logo',[['logo','Text im Logo',2]]],['foot','Fußzeile',[['foot','Text',1]]],['rib1','Band 1',[]],['rib2','Band 2',[]],['rib3','Band 3',[]],['rib4','Band 4 (blau)',[]]];
function panel(){
 $('#chips').innerHTML='';ELS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=S.sel===k?'on':'';b.onclick=()=>{S.sel=k;panel();render()};$('#chips').append(b)});
 const el=ELS.find(e=>e[0]===S.sel),box=$('#fields');box.innerHTML='';
  const rib=S.sel.slice(0,3)==='rib',img=rib||S.sel==='logo',p=S.pos[S.sel];
 [['x','Waagerecht',rib?-100:0,100,.1],['y','Senkrecht',rib?-100:0,100,.1],['s','Größe',.3,2.5,.01]].forEach(([k,l,mn,mx,st])=>{
  const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${l}</span><input type="range" min="${mn}" max="${mx}" step="${st}"><output></output>`;
  const i=d.querySelector('input'),o=d.querySelector('output');i.value=p[k];o.textContent=(+p[k]).toFixed(k==='s'?2:1);i.oninput=()=>{p[k]=+i.value;o.textContent=(+i.value).toFixed(k==='s'?2:1);render()};box.append(d)});
 if(img){const r=document.createElement('div');r.className='row';
  r.innerHTML=`<label class="fbtn">Eigenes Bild laden<input type="file" accept="image/*" hidden></label><button type="button">Standard</button>`;
  r.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{imgs[S.sel]=im;if(rib)S.pos[S.sel]={x:0,y:0,s:1};panel();render()};im.src=URL.createObjectURL(f)};
  r.querySelector('button').onclick=()=>{delete imgs[S.sel];S.pos[S.sel]=JSON.parse(JSON.stringify(DEF().pos[S.sel]));panel();render()};box.append(r);
  const h=document.createElement('div');h.className='hint';h.textContent=rib?'Ein eigenes Bild (am besten PNG mit transparentem Hintergrund, Breite = Plakatbreite) ersetzt dieses Band.':'Ein eigenes Logo (am besten PNG mit transparentem Hintergrund) ersetzt das Standardlogo.';box.append(h)}
 else{const h=document.createElement('div');h.className='hint';h.textContent='Du kannst das Element auch direkt in der Vorschau anklicken und ziehen.';box.append(h)}
}
const TXT=[['title','Titel',1],['sub','Untertitel',1],['dates','Termine (eine Zeile pro Termin)',3],['claim','Claim',2],['cta','Anmeldetext',3,'Mit *Sternchen* wird ein Wort fett.'],['logo','Logo-Text',2],['foot','Fußzeile',2]];
const SELK={date:'body',event:'body',thema:'body',focus:'body',free:'body',signName:'sign',signRole:'sign'};
function buildTexts(){const box=$('#texts');box.innerHTML='';TXT.forEach(([k,l,rows,h])=>{const lb=document.createElement('label');lb.className='l';lb.textContent=l;const t=rows>1?document.createElement('textarea'):document.createElement('input');if(rows>1)t.rows=rows;else t.type='text';t.value=S.tx[k];t.oninput=()=>{S.tx[k]=t.value;render()};t.onfocus=()=>{S.sel=SELK[k]||k;if(adv.open)panel();render()};box.append(lb,t);if(h){const d=document.createElement('div');d.className='hint';d.textContent=h;box.append(d)}})}
function ctl(){
 document.querySelectorAll('#thm button').forEach(b=>b.className=b.dataset.t===S.theme?'on':'');
 $('#cols').innerHTML='';for(const k in CL){const l=document.createElement('label');l.append(CL[k]);const i=document.createElement('input');i.type='color';i.value=S.th[S.theme][k];i.oninput=()=>{S.th[S.theme][k]=i.value;render()};l.append(i);$('#cols').append(l)}
 $('#fT').value=S.fT;$('#fB').value=S.fB;$('#fmt').value=S.fmt;$('#both').checked=S.both;
}
document.querySelectorAll('#thm button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;ctl();render()});
$('#fT').onchange=e=>{S.fT=e.target.value;render()};$('#fB').onchange=e=>{S.fB=e.target.value;render()};
$('#fmt').onchange=e=>{S.fmt=e.target.value;save()};$('#both').onchange=e=>{S.both=e.target.checked;save()};
$('#bReset').onclick=()=>{if(!confirm('Alle Eingaben und Positionen zurücksetzen?'))return;S=DEF();buildTexts();for(const k in imgs)delete imgs[k];ctl();panel();render()};

// Ziehen in der Vorschau
let drag=null;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
cv.addEventListener('pointerdown',e=>{if(!adv.open)return;const[fx,fy]=pt(e),px=fx*cv.width,py=fy*cv.height,order=['foot','logo','cta','claim','dates','title'];
 const k=order.find(k=>boxes[k]&&px>=boxes[k][0]&&px<=boxes[k][2]&&py>=boxes[k][1]&&py<=boxes[k][3]);
 if(!k)return;cv.setPointerCapture(e.pointerId);S.sel=k;const p=S.pos[k];drag={k,dx:p.x-fx*100,dy:p.y-fy*100};panel();render()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[fx,fy]=pt(e),p=S.pos[drag.k];p.x=Math.round(Math.min(100,Math.max(0,fx*100+drag.dx))*10)/10;p.y=Math.round(Math.min(100,Math.max(0,fy*100+drag.dy))*10)/10;
 document.querySelectorAll('#fields .sl').forEach((d,i)=>{if(i<2){const v=i?p.y:p.x;d.querySelector('input').value=v;d.querySelector('output').textContent=v.toFixed(1)}});render()});
['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>{drag=null}));

// Export
async function fonts(){try{await Promise.all([document.fonts.load('400 40px "Atkinson Hyperlegible"'),document.fonts.load('700 40px "Atkinson Hyperlegible"'),document.fonts.load('400 40px "Archivo Black"'),document.fonts.load('700 40px Arial'),document.fonts.load('400 40px Arial')])}catch(e){}}
function page(tn){const W={a5:1748,a4:2480,a3:3508}[S.fmt],H=Math.round(W*1.41421),c=document.createElement('canvas');c.width=W;c.height=H;draw(c.getContext('2d'),W,H,tn,null);return c}
async function saveFile(name,blob){
 let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});msg('Gespeichert: '+name)}catch(e){msg(e&&e.code==='declined'?'Abgebrochen.':'Speichern nicht möglich.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg('Datei erstellt: '+name);
}
$('#bPdf').onclick=async()=>{
 if(!(window.jspdf&&window.jspdf.jsPDF)){msg('PDF-Bibliothek nicht geladen (Internetverbindung?).');return}
 const b=$('#bPdf');b.disabled=true;msg('PDF wird erstellt …');
 try{await fonts();const f=S.fmt,sz={a5:[148,210],a4:[210,297],a3:[297,420]}[f],doc=new window.jspdf.jsPDF({unit:'mm',format:[sz[0],sz[1]],orientation:'portrait'}),tl=S.both?['light','dark']:[S.theme];
  tl.forEach((tn,i)=>{if(i)doc.addPage([sz[0],sz[1]],'portrait');doc.addImage(page(tn).toDataURL('image/jpeg',.95),'JPEG',0,0,sz[0],sz[1])});
  await saveFile('plakat-'+(S.both?'hell-dunkel':S.theme)+'-'+f+'.pdf',doc.output('blob'))}
 catch(e){console.error(e);msg('PDF konnte nicht erstellt werden.')}
 b.disabled=false};
$('#bPng').onclick=async()=>{await fonts();page(S.theme).toBlob(bl=>saveFile('plakat-'+S.theme+'.png',bl),'image/png')};

addEventListener('resize',render);
buildTexts();ctl();panel();render();cv.style.cursor='default';adv.addEventListener('toggle',()=>{cv.style.cursor=adv.open?'grab':'default';panel();render()});
(document.fonts&&Promise.all([document.fonts.load('400 40px "Atkinson Hyperlegible"'),document.fonts.load('700 40px "Atkinson Hyperlegible"')]).then(render).catch(()=>{}));
</script>
</body>
</html>
