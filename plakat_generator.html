<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Plakat-Generator Hackathon</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--bd:#d9dce2;--ac:#2c9bd2;--acf:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:1fr minmax(300px,370px);gap:16px;padding:16px;max-width:1100px;margin:0 auto}@media(max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:12px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.big{width:100%;padding:10px;border-radius:12px;margin-top:6px}
label.l{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}textarea{width:100%;font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.sl{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;margin-top:6px;font-size:13px}.sl output{text-align:right;color:var(--mut)}
.stage{position:sticky;top:12px;align-self:start}#pz{display:block;width:100%;max-width:520px;margin:0 auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);touch-action:none}
.m{stroke-linejoin:round}.hd{cursor:grab}
@media print{.card,.chips,.tools{display:none}.app{display:block;padding:0}.stage{position:static}#pz{box-shadow:none;max-width:none}@page{margin:0}}
</style></head><body><div class="app">
<div class="stage"><div id="assetStatus" role="status" style="font-size:12px;color:var(--mut);text-align:center;margin:0 0 6px"></div><div class="chips" id="vch" style="justify-content:center;margin-bottom:10px"></div>
<svg id="pz" viewBox="0 0 755 1068" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="cp"><rect width="755" height="1068"/></clipPath>
<linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop id="gt0" offset="0"/><stop id="gt1" offset="1"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop id="gb0" offset="0"/><stop id="gb1" offset="1"/></linearGradient>
</defs>
<rect width="755" height="1068" fill="#fff"/><rect id="fld"/><rect id="et" height="12" fill="url(#gt)"/><rect id="eb" height="12" fill="url(#gb)"/>
<g clip-path="url(#cp)" id="bl"></g><g id="ln" fill="none" stroke-width="1.2"></g><g id="tx"></g><g id="fx"></g><g id="hl"></g></svg></div>
<div><div class="card"><h2>Variante</h2><div class="chips" id="vc2"></div><h2>Format (DIN, Hochformat)</h2><div class="chips" id="fc"></div><h2>Texte</h2><div id="tf"></div>
<div class="tools"><button class="pri big" id="bsv">SVG speichern</button><button class="big" id="bpr">Drucken / PDF</button></div></div>
<details class="card"><summary style="cursor:pointer;font-weight:600">Feinjustierung</summary><h2>Element</h2><div class="chips" id="ec"></div><div id="sc"></div>
<div class="sl"><span>Linien</span><input type="range" id="lw" min=".3" max="3" step=".05"><output id="lwo"></output></div>
<div class="chips" style="margin-top:10px"><button id="bh">Linien-Griffe</button><button id="br">Zurücksetzen</button></div><p style="font-size:12px;color:var(--mut)">Elemente lassen sich auch direkt im Plakat ziehen.</p></details></div></div>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',BW={};
const ASSET_FILES={
  moe:'moebius_Logo_Raeume.svg',
  bht:'BHT_Logo_vertikal_Anthrazit_transparent.svg',
  gl:'plakat_gruen_band_links_v01.svg',
  glo:'plakat_gruen_band_links_oben_v01.svg',
  gzb:'plakat_gruen_band_zentral_blau_v01.svg',
  bzb:'plakat_blau_band_zentral_blau_v01.svg',
  bkg:'plakat_blau_band_klein_gruen_v01.svg',
  gzg:'plakat_gruen_band_zentral_gruen_v01.svg'
};
const BAND_BOUNDS={
  gl:{x:207.037,y:11.945,width:776.477,height:776.364},
  glo:{x:281.846,y:83.167,width:626.859,height:639.383},
  gzb:{x:2.757,y:167.018,width:1175.794,height:937.694},
  bzb:{x:203.118,y:123.886,width:784.315,height:871.876},
  bkg:{x:123.141,y:314.626,width:352.797,height:262.962},
  gzg:{x:2.757,y:167.018,width:1175.794,height:937.694}
};
const ASSETS={};
function parseViewBox(root){
  const raw=root.getAttribute('viewBox');
  if(!raw) throw new Error('viewBox fehlt');
  const v=raw.trim().split(/[ ,]+/).map(Number);
  if(v.length!==4 || v.some(n=>!Number.isFinite(n))) throw new Error('viewBox ungültig');
  return v;
}
async function loadSVGAsset(id,filename){
  const response=await fetch('input/'+filename);
  if(!response.ok) throw new Error(filename+' (HTTP '+response.status+')');
  const source=await response.text();
  const doc=new DOMParser().parseFromString(source,'image/svg+xml');
  const root=doc.documentElement;
  if(doc.querySelector('parsererror') || root.localName!=='svg') throw new Error(filename+' (ungültige SVG-Datei)');
  const viewBox=parseViewBox(root);
  const bounds=BAND_BOUNDS[id] || null;
  if(bounds) BW[id]=bounds.width;
  // SVGs werden als XML geparst: Gruppen deshalb namespace-bewusst suchen.
  const groups=root.getElementsByTagNameNS(NS,'g');
  const graphicGroup=groups.length ? groups[0] : null;
  if(['gl','glo','gzb','bzb','bkg','gzg'].includes(id) && !graphicGroup)
    throw new Error(filename+' (keine SVG-Grafikgruppe im Namespace '+NS+' gefunden)');
  ASSETS[id]={doc,root,viewBox,bounds,graphicGroup};
}
async function loadAssets(){
  const status=$('#assetStatus');
  status.textContent='Grafiken werden geladen …';
  const entries=Object.entries(ASSET_FILES);
  const results=await Promise.allSettled(entries.map(([id,file])=>loadSVGAsset(id,file)));
  const failed=results.map((r,i)=>r.status==='rejected'?entries[i][1]+': '+r.reason.message:null).filter(Boolean);
  if(failed.length){
    status.textContent='SVG-Dateien konnten nicht geladen werden: '+failed.join(' · ');
    status.style.color='#b42318';
    throw new Error(failed.join('\\n'));
  }
  status.textContent='';
}
function makeNestedSVG(id,viewBox,width,height,children){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('x','0'); svg.setAttribute('y','0');
  svg.setAttribute('width',String(width)); svg.setAttribute('height',String(height));
  svg.setAttribute('viewBox',viewBox.join(' '));
  svg.setAttribute('preserveAspectRatio','none');
  children.forEach(n=>svg.appendChild(n));
  return svg;
}
function bandGraphic(id,color,scale){
  const a=ASSETS[id],b=a.bounds;
  const group=document.importNode(a.graphicGroup,true);
  const paths=group.getElementsByTagNameNS(NS,'path');
  Array.from(paths).forEach(path=>{
    const originalWidth=parseFloat(path.style.strokeWidth || path.getAttribute('stroke-width') || '0.3');
    path.style.setProperty('stroke',color);
    path.style.setProperty('fill','none');
    path.style.setProperty('stroke-width',((originalWidth>=1 ? 1 : .55)*LW/scale)+'px');
  });
  const svg=makeNestedSVG(id,[b.x,b.y,b.width,b.height],b.width,b.height,[group]);
  return svg;
}
function logoGraphic(id){
  const a=ASSETS[id],v=a.viewBox;
  const children=Array.from(a.root.childNodes).filter(n=>n.nodeType===1 || (n.nodeType===3 && n.textContent.trim())).map(n=>document.importNode(n,true));
  return makeNestedSVG(id,v,v[2],v[3],children);
}
const C={tx:'#333333',g:'#96C21B',bf:'#2C9BD2',bb:'#0D4E6E',w:'#fff'};
const PL='"IBM Plex Sans",Arial,sans-serif',AT='"Atkinson Hyperlegible",Arial,sans-serif';
const V={
blau:{name:'Blau',field:{y:330,c:C.bf,e:C.g},
 bands:[['bzb',-193,145,700,C.bb],['bkg',387,610,317,C.g]],
 lines:[[347,42,240,225,C.bb],[460,398,382,395,'#fff'],[245,535,335,740,'#fff']],
 tx:{title:['Hackathon'],sub:['Für alle vom CJD Sickingenstraße'],claim:['Dein CJD braucht','Deine Ideen'],cta:['Melde dich jetzt an!']},
 P:{title:[355,92,70,C.tx],sub:[355,123,21,C.tx],claim:[460,430,29,'#fff'],cta:[460,496,17,'#fff'],dates:[23,570,53,'#fff'],foot:[153,1041,10,C.tx]}},
gruen:{name:'Grün',field:{y:585,c:C.g,e:C.bf},
 bands:[['glo',-70,0,380,C.g],['gl',-323,65,520,C.g],['gzb',217,250,752,C.bb]],
 lines:[[347,42,157,190,C.g],[419,355,337,310,C.g],[257,638,517,750,'#fff']],
 tx:{title:['Keine Lust','mehr'],sub:['auf Ruhepause auf der Toilette?'],claim:['Dein CJD braucht Deine','Ideen'],cta:['Hackathon - für alle vom CJD','Sickingenstraße. Melde dich jetzt an!']},
 P:{title:[357,88,70,C.tx],sub:[357,195,24,C.tx],claim:[420,377,24,C.tx],cta:[420,435,17,C.tx],dates:[33,675,53,'#fff'],foot:[153,1041,10,C.tx]}}};
const DT=[['02.12.26','Pausenraum für alle.'],['04.12.26','Das CJD sichtbar machen.'],['11.12.26','Feedback, das ankommt.']];
const FM={A2:[420,594],A3:[297,420],A4:[210,297],A5:[148,210]};let fmt='A4',cur='blau',sel='title',edit=false,LW=1,S={};
const init=k=>{const v=V[k],o={};v.bands.forEach(b=>o[b[0]]={x:b[1],y:b[2],s:b[3]/BW[b[0]]});o.moe={x:25,y:968,s:104/4000};o.bht={x:690,y:952,s:100/243};
 for(const t in v.P)o[t]={x:0,y:0,s:1};o.lines=v.lines.map(l=>l.slice(0,4));o.tx=JSON.parse(JSON.stringify(v.tx));o.dt=DT.map(d=>d.slice());return o};

const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function txt(p,x,y,fs,fill,lines,font,wt,ls){const t=el('text',{x,y,'font-size':fs,fill,'font-family':font,'font-weight':wt,'letter-spacing':ls||0},p);lines.forEach((l,i)=>{const s=el('tspan',{x,dy:i?fs*1.15:0},t);s.textContent=l});return t}
function render(){const v=V[cur],s=S[cur];
 const f=$('#fld');f.setAttribute('x',0);f.setAttribute('y',v.field.y);f.setAttribute('width',755);f.setAttribute('height',938-v.field.y);f.setAttribute('fill',v.field.c);
 for(const [id,y] of [['et',v.field.y],['eb',926]]){const r=$('#'+id);r.setAttribute('x',0);r.setAttribute('y',y);r.setAttribute('width',755)}
 const top=id=>id=='et';$('#gt0').setAttribute('stop-color',v.field.e);$('#gt1').setAttribute('stop-color',v.field.c);$('#gb0').setAttribute('stop-color',v.field.c);$('#gb1').setAttribute('stop-color',v.field.e);
 const bl=$('#bl');bl.innerHTML='';
 v.bands.forEach(b=>{const o=s[b[0]],g=el('g',{transform:`translate(${o.x} ${o.y}) scale(${o.s})`,'data-id':b[0],class:'hd'},bl);
  g.appendChild(bandGraphic(b[0],b[4],o.s));});
 const ln=$('#ln');ln.innerHTML='';s.lines.forEach((l,i)=>el('line',{x1:l[0],y1:l[1],x2:l[2],y2:l[3],stroke:v.lines[i][4]},ln));
 const tx=$('#tx');tx.innerHTML='';const P=v.P,T=s.tx;
 const G=(id,fn)=>{const g=el('g',{transform:`translate(${s[id].x} ${s[id].y}) scale(${s[id].s})`,'data-id':id,class:'hd'},tx);fn(g)};
 G('title',g=>txt(g,P.title[0],P.title[1],P.title[2],P.title[3],T.title,PL,700,-1.5));
 G('sub',g=>txt(g,P.sub[0],P.sub[1],P.sub[2],P.sub[3],T.sub,PL,400));
 G('claim',g=>txt(g,P.claim[0],P.claim[1],P.claim[2],P.claim[3],T.claim,AT,700));
 G('cta',g=>txt(g,P.cta[0],P.cta[1],P.cta[2],P.cta[3],T.cta,PL,400));
 G('dates',g=>s.dt.forEach((d,i)=>{txt(g,P.dates[0],P.dates[1]+i*90,53,P.dates[3],[d[0]],AT,700);txt(g,P.dates[0],P.dates[1]+i*90+26,17,P.dates[3],[d[1]],PL,400)}));
 const fx=$('#fx');fx.innerHTML='';
 const L=(id,inner,fn)=>{const o=s[id],g=el('g',{transform:`translate(${o.x} ${o.y}) scale(${o.s})`,'data-id':id,class:'hd'},fx);fn(g)};
 L('moe',0,g=>{g.appendChild(logoGraphic('moe'))});L('bht',0,g=>{g.appendChild(logoGraphic('bht'))});
 G('foot',g=>txt(g,P.foot[0],P.foot[1],P.foot[2],P.foot[3],['In Zusammenarbeit mit dem Masterstudiengang Transformation Design & Print der BHT'],'Arial,sans-serif',400));
 $('#fx').appendChild($('#tx').lastChild);
 const hl=$('#hl');hl.innerHTML='';if(edit)s.lines.forEach((l,i)=>[0,2].forEach(j=>{const c=el('circle',{cx:l[j],cy:l[j+1],r:7,fill:'#ff0','fill-opacity':.7,stroke:'#000','stroke-width':1,'data-l':i,'data-j':j},hl);c.style.cursor='move'}));
 $('#vch').innerHTML=$('#vc2').innerHTML='';for(const k in V){for(const h of [$('#vch'),$('#vc2')]){const b=document.createElement('button');b.textContent=V[k].name;b.className=k==cur?'on':'';b.onclick=()=>{cur=k;sel='title';render();ctl()};h.appendChild(b)}}
}
const EL=[['title','Titel'],['sub','Untertitel'],['claim','Claim'],['cta','Anmeldetext'],['dates','Termine'],['foot','Fußzeile'],['moe','Möbius-Logo'],['bht','BHT-Logo']];
function ctl(){const v=V[cur],s=S[cur];const ids=[...v.bands.map(b=>[b[0],'Band '+b[0]]),...EL];
 const ec=$('#ec');ec.innerHTML='';ids.forEach(([id,n])=>{const b=document.createElement('button');b.textContent=n;b.className=id==sel?'on':'';b.onclick=()=>{sel=id;ctl()};ec.appendChild(b)});
 const o=s[sel],sc=$('#sc'),bandish=!!s[sel]&&(v.bands.some(b=>b[0]==sel)||sel=='moe'||sel=='bht'),r=bandish?[[-700,900],[-300,1200],[.05,2.5]]:[[-300,300],[-300,300],[.5,2]];
 sc.innerHTML='';[['x','x',0],['y','y',1],['Größe','s',2]].forEach(([n,k,i])=>{const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${n}</span><input type=range min=${r[i][0]} max=${r[i][1]} step=${k=='s'?.005:1} value=${o[k]}><output>${(+o[k]).toFixed(k=='s'?2:0)}</output>`;const inp=d.querySelector('input');inp.oninput=()=>{o[k]=+inp.value;d.querySelector('output').textContent=(+inp.value).toFixed(k=='s'?2:0);render()};sc.appendChild(d)});
 const tf=$('#tf');tf.innerHTML='';const T=s.tx;[['title','Titel'],['sub','Untertitel'],['claim','Claim'],['cta','Anmeldetext']].forEach(([k,n])=>{const l=document.createElement('label');l.className='l';l.textContent=n;const a=document.createElement('textarea');a.rows=Math.max(1,T[k].length);a.value=T[k].join('\n');a.oninput=()=>{T[k]=a.value.split('\n');render()};tf.append(l,a)});
 const l=document.createElement('label');l.className='l';l.textContent='Termine (Datum | Text pro Zeile)';const a=document.createElement('textarea');a.rows=3;a.value=s.dt.map(d=>d.join(' | ')).join('\n');a.oninput=()=>{s.dt=a.value.split('\n').filter(Boolean).slice(0,3).map(z=>z.split('|').map(q=>q.trim()))};a.onchange=render;a.oninput=()=>{s.dt=a.value.split('\n').filter(Boolean).slice(0,3).map(z=>{const p=z.split('|').map(q=>q.trim());return[p[0]||'',p[1]||'']});render()};tf.append(l,a)}
// Ziehen
let dr=null;const pt=e=>{const m=$('#pz').getScreenCTM().inverse(),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return p};
$('#pz').addEventListener('pointerdown',e=>{const c=e.target.closest('circle[data-l]');const p=pt(e);if(c){dr={l:+c.dataset.l,j:+c.dataset.j};$('#pz').setPointerCapture(e.pointerId);return}
 const g=e.target.closest('[data-id]');if(!g)return;sel=g.dataset.id;dr={id:sel,px:p.x,py:p.y,ox:S[cur][sel].x,oy:S[cur][sel].y};$('#pz').setPointerCapture(e.pointerId);ctl()});
$('#pz').addEventListener('pointermove',e=>{if(!dr)return;const p=pt(e),s=S[cur];if(dr.id){s[dr.id].x=Math.round(dr.ox+p.x-dr.px);s[dr.id].y=Math.round(dr.oy+p.y-dr.py)}else{s.lines[dr.l][dr.j]=Math.round(p.x);s.lines[dr.l][dr.j+1]=Math.round(p.y)}render();if(dr.id)ctl()});
$('#pz').addEventListener('pointerup',()=>dr=null);
$('#bh').onclick=()=>{edit=!edit;$('#bh').className=edit?'on':'';render()};
$('#br').onclick=()=>{S[cur]=init(cur);render();ctl()};
$('#lw').value=1;$('#lwo').textContent='1.0';$('#lw').oninput=e=>{LW=+e.target.value;$('#lwo').textContent=LW.toFixed(1);render()};
function svgOut(){const c=$('#pz').cloneNode(true);c.querySelector('#hl').remove();c.querySelectorAll('.hd').forEach(g=>g.removeAttribute('class'));c.setAttribute('width',FM[fmt][0]+'mm');c.setAttribute('height',FM[fmt][1]+'mm');c.removeAttribute('id');c.removeAttribute('style');
 const st=document.createElementNS(NS,'style');st.textContent="@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');";c.insertBefore(st,c.firstChild);return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c)}
$('#bsv').onclick=async()=>{const fn='plakat_'+cur+'_'+fmt+'.svg',data=svgOut();try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:fn,data});return}}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));a.download=fn;a.click()};
function fch(){const h=$('#fc');h.innerHTML='';for(const k in FM){const b=document.createElement('button');b.textContent=k+' ('+FM[k][0]+' x '+FM[k][1]+' mm)';b.className=k==fmt?'on':'';b.onclick=()=>{fmt=k;fch()};h.appendChild(b)}}
$('#bpr').onclick=()=>{let st=$('#pgs');if(!st){st=document.createElement('style');st.id='pgs';document.head.appendChild(st)}st.textContent='@media print{@page{size:'+FM[fmt][0]+'mm '+FM[fmt][1]+'mm;margin:0}}';try{window.print()}catch(e){}};
loadAssets().then(()=>{for(const k in V)S[k]=init(k);render();ctl();fch()}).catch(err=>{console.error(err);$('#assetStatus').title=err.message});
</script></body></html>
