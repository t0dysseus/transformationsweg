<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformation 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--fg:#1c1c22;--btn:#ffffff;--bd:#c9c9d2;--ink:#1d6f9f;--wash:#1d6f9f;--gray:#6b6e73;--blue:#0fa3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--fg:#ececf2;--btn:#1d1d25;--bd:#3a3a46;--ink:#3a9bd4;--wash:#3a9bd4;--gray:#c6cace;--blue:#4cc9f0}}
:root[data-theme="dark"]{--bg:#101014;--fg:#ececf2;--btn:#1d1d25;--bd:#3a3a46;--ink:#3a9bd4;--wash:#3a9bd4;--gray:#c6cace;--blue:#4cc9f0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.tag{position:fixed;display:none;pointer-events:none;transform:translate(-50%,-100%);max-width:12em;padding:8px 12px;border-radius:14px;background:#fff;color:#000;box-shadow:0 6px 24px rgba(0,0,0,.35);font:400 14px/1.35 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.tag .d{display:block;font-size:12px;opacity:.7}
.tag .h{display:block;font:600 16px/1.3 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.tag.below{transform:translate(-50%,0)}
.tag.left{transform:translate(-100%,-50%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var T=THREE,canvas=document.getElementById('c');
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new T.Scene();
var camera=new T.PerspectiveCamera(38,1,0.1,200);
var inkMat=new T.MeshBasicMaterial({color:0x26268f});
var washMat=new T.MeshBasicMaterial({color:0x26268f,transparent:true,opacity:0.07,side:T.DoubleSide,depthWrite:false});
var wireMat=new T.MeshBasicMaterial({color:0x26268f,wireframe:true,transparent:true,opacity:0.4,depthWrite:false});
var cubeMat=new T.MeshLambertMaterial({color:0x26268f});
var lineMat=new T.LineBasicMaterial({color:0x26268f});
var blueMat=new T.MeshLambertMaterial({color:0x1f6bff});
scene.add(new T.AmbientLight(0xffffff,0.65));
var sun=new T.DirectionalLight(0xffffff,0.8);sun.position.set(5,10,7);scene.add(sun);

function applyTheme(){
  var cs=getComputedStyle(document.documentElement);
  scene.background=new T.Color(cs.getPropertyValue('--bg').trim());
  inkMat.color.set(cs.getPropertyValue('--ink').trim());
  washMat.color.set(cs.getPropertyValue('--wash').trim());
  wireMat.color.set(cs.getPropertyValue('--wash').trim());
  cubeMat.color.set(cs.getPropertyValue('--gray').trim());
  blueMat.color.set(cs.getPropertyValue('--blue').trim());
  lineMat.color.set(cs.getPropertyValue('--ink').trim());
}
applyTheme();
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener('change',applyTheme):mq.addListener(applyTheme));}

var model=new T.Group();
var rig=new T.Group();
rig.add(model);
scene.add(rig);

var grays=[];
function R(t,p){return Math.pow(t,p);}
function build(H,Ro,Rm,Ri,sign,p,crosses){
  var i,t;
  [[Ro,0.04],[Rm,0.037],[Ri,0.035]].forEach(function(d){
    var g=new T.TorusGeometry(d[0],d[1],8,96);g.rotateX(Math.PI/2);
    var m=new T.Mesh(g,inkMat);m.position.y=sign*H;model.add(m);
  });
  [Ro,Rm,Ri].forEach(function(rad){
    var prof=[];for(i=0;i<=30;i++){t=i/30;prof.push(new T.Vector2(rad*R(t,p),sign*H*t));}
    var lg=new T.LatheGeometry(prof,40);
    model.add(new T.Mesh(lg,washMat));model.add(new T.Mesh(lg,wireMat));
  });
  crosses.forEach(function(c){
    var bg=new T.BoxGeometry(0.44,0.44,0.44);
    var x=new T.Mesh(bg,cubeMat);x.add(new T.LineSegments(new T.EdgesGeometry(bg),lineMat));
    var rr,tt=0.75+(c[0]-0.75)*0.75;
    rr=c[1]*Ro*R(tt,p);
    x.position.set(rr*Math.cos(c[2]),sign*H*tt,rr*Math.sin(c[2]));
    model.add(x);grays.push(x);
  });
}
build(7.9,3.5,2.55,1.6,1,1.3,[[0.99,0.15,0.5],[0.97,0.5,3.4],[0.95,0.8,1.5],[0.92,0.35,5.0],[0.9,0.7,2.6],[0.87,0.55,4.2],[0.84,0.25,1.9],[0.8,0.6,5.8],[0.77,0.4,0.2]]);
build(6.6,2.9,2.0,1.1,-1,1.25,[[0.98,0.3,2.2],[0.96,0.75,5.2],[0.93,0.5,0.4],[0.91,0.2,3.6],[0.85,0.55,4.7],[0.78,0.65,0.9]]);
var apex=new T.Mesh(new T.SphereGeometry(0.14,16,16),inkMat);model.add(apex);

var tagCfg=[
 {t:1,f:0.85,a:0,off:[-2.8,-1.0,0],pos:'left'},
 {t:1,f:0.53,a:0,off:[-2.8,0.3,0],pos:'left'},
 {t:1,f:0.19,a:0,off:[-2.8,1.6,0],pos:'left'}
];
var picks=[],tags=[],chain=[],ray=new T.Raycaster(),ndc=new T.Vector2(),down=null;
tagCfg.forEach(function(c,ti){
  var rr=c.f*2.9*R(c.t,1.25);
  var m=new T.Mesh(new T.BoxGeometry(0.46,0.46,0.46),blueMat);
  m.position.set(rr*Math.cos(c.a),-6.6*c.t,rr*Math.sin(c.a));
  model.add(m);picks.push(m);chain.push(m.position.clone());
  var end=m.position.clone().add(new T.Vector3(-c.off[1],c.off[0],c.off[2]));
  var ln=new T.Line(new T.BufferGeometry().setFromPoints([m.position.clone(),end]),lineMat);
  ln.visible=false;model.add(ln);
  var el=document.createElement('div');
  el.className='tag '+c.pos;
  var dd=document.createElement('span');dd.className='d';dd.textContent='30.11.';var hh=document.createElement('span');hh.className='h';hh.textContent='Treffen mit Berufsfeldsprechern';el.appendChild(dd);el.appendChild(hh);
  document.body.appendChild(el);
  tags.push({el:el,ln:ln,end:end,on:false});
});
model.add(new T.Line(new T.BufferGeometry().setFromPoints(chain),lineMat));
/* die drei grauen Würfel, die den blauen am nächsten liegen, werden ebenfalls blau, anklickbar, mit eigenem Inhalt */
function mkTag(m,end,date,head){
  var ln=new T.Line(new T.BufferGeometry().setFromPoints([m.position.clone(),end]),lineMat);
  ln.visible=false;model.add(ln);
  var el=document.createElement('div');el.className='tag left';
  var dd=document.createElement('span');dd.className='d';dd.textContent=date;
  var hh=document.createElement('span');hh.className='h';hh.textContent=head;
  el.appendChild(dd);el.appendChild(hh);document.body.appendChild(el);
  tags.push({el:el,ln:ln,end:end,on:false});
}
grays.map(function(g){var d=Math.min.apply(null,picks.map(function(p){return g.position.distanceTo(p.position);}));return {g:g,d:d};})
  .sort(function(a,b){return a.d-b.d;}).slice(0,3)
  .sort(function(a,b){return b.g.position.y-a.g.position.y;})
  .forEach(function(o,i){
    var g=o.g;g.material=blueMat;g.remove(g.children[0]);picks.push(g);
    var rl=Math.hypot(g.position.x,g.position.z)||1;
    var end=g.position.clone().add(new T.Vector3(g.position.x/rl*2.2,-2.8,g.position.z/rl*2.2));
    mkTag(g,end,'Datum X','Hack '+(i+1));
  });

function hit(e){
  var r=canvas.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var h=ray.intersectObjects(picks);
  return h.length?picks.indexOf(h[0].object):-1;
}
function updateTags(){
  model.updateMatrixWorld();
  var r=canvas.getBoundingClientRect();
  tags.forEach(function(t){
    if(!t.on){t.el.style.display='none';return;}
    var v=t.end.clone();model.localToWorld(v);v.project(camera);
    if(v.z>1){t.el.style.display='none';return;}
    t.el.style.display='block';
    t.el.style.left=(r.left+(v.x+1)/2*r.width)+'px';
    t.el.style.top=(r.top+(1-v.y)/2*r.height)+'px';
  });
}
canvas.addEventListener('pointerdown',function(e){down=Object.keys(ptrs).length>0?null:{x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointercancel',function(){down=null;});
canvas.addEventListener('pointerup',function(e){
  if(!down)return;
  var d=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(d>6)return;
  var i=hit(e);
  if(i>=0){tags[i].on=!tags[i].on;tags[i].ln.visible=tags[i].on;}
});
canvas.addEventListener('pointermove',function(e){
  if(e.buttons)return;
  canvas.style.cursor=hit(e)>=0?'pointer':'';
});

model.position.y=-0.65;
rig.rotation.z=-Math.PI/2; /* Standard: um 90 Grad gedreht, liegt längs, Basis links, Entfaltung rechts */

var theta=0.45,phi=1.25,dist=26;
function place(){
  camera.position.set(dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi),dist*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(0,0,0);
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  dist=Math.max(Math.min(dist,70),2);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

var ptrs={},last=0;
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};last=0;});
canvas.addEventListener('pointerup',function(e){delete ptrs[e.pointerId];last=0;});
canvas.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];last=0;});
canvas.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var ids=Object.keys(ptrs);
  if(ids.length===1){
    theta-=(e.clientX-p.x)*0.006;
    phi=Math.min(Math.max(phi-(e.clientY-p.y)*0.006,0.12),Math.PI-0.12);
  }else if(ids.length===2){
    var o=ptrs[ids[0]==e.pointerId?ids[1]:ids[0]];
    var d0=Math.hypot(p.x-o.x,p.y-o.y);
    var d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    if(d1>0)dist=Math.min(Math.max(dist*d0/d1,2),70);
  }
  p.x=e.clientX;p.y=e.clientY;
});
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  dist=Math.min(Math.max(dist*Math.exp(e.deltaY*0.001),2),70);
},{passive:false});

var lastT=performance.now();
(function loop(){
  var now=performance.now(),dt=Math.min((now-lastT)/1000,0.1);lastT=now;
  var open=tags.some(function(t){return t.on;});
  if(!open&&Object.keys(ptrs).length===0)model.rotation.y+=dt*0.3;
  place();renderer.render(scene,camera);updateTags();requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
