<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformationsweg: Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plex:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--atk:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--neon:#2C8CBE;--cyan:#4cc9f0;--ink:#e8fbff}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:var(--atk);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cords{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#cords .node{pointer-events:auto;cursor:pointer}
#cords .node circle{filter:drop-shadow(0 0 5px #4cc9f0)}
#cords line{filter:drop-shadow(0 0 3px #2C8CBE)}
#hdr{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:3;text-align:center;width:max-content;max-width:92vw}
#hdr h1{margin:0;font:600 22px/1.2 var(--plex);letter-spacing:.01em}
#hdr .sub{margin-top:2px;font:400 13px/1.35 var(--atk);opacity:.75}
#ctl{display:flex;gap:8px;justify-content:center;margin-top:10px}
#ctl button{background:#0b0f14;color:var(--ink);border:1px solid var(--neon);border-radius:999px;padding:6px 14px;font:400 14px var(--atk);cursor:pointer;touch-action:manipulation}
#ctl button[aria-pressed="true"]{border-color:#fff}
.card{position:fixed;z-index:4;display:flex;flex-direction:column;box-sizing:border-box;background:rgba(6,10,16,.94);border:1px solid var(--neon);border-radius:14px;overflow:hidden;box-shadow:0 0 22px rgba(44,140,190,.32)}
.card .bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;font:700 14px var(--atk);color:var(--ink)}
.card .num{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cyan);color:var(--cyan);font:600 12px var(--plex)}
.card .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .b{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--neon);border-radius:999px;background:#0b0f14;color:var(--ink);font:400 15px var(--atk);text-decoration:none;cursor:pointer;padding:0}
.card .b:hover{border-color:#fff}
.card iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
/* Hochformat: Schleife oben, Fenster als 2x2-Raster darunter */
.c1{left:2vw;top:36vh;width:47vw;height:29vh}
.c2{left:51vw;top:36vh;width:47vw;height:29vh}
.c3{left:2vw;top:67vh;width:47vw;height:29vh}
.c4{left:51vw;top:67vh;width:47vw;height:29vh}
/* Querformat: Schleife in der Mitte, je zwei Fenster links und rechts */
@media (min-aspect-ratio:115/100){
  .c1{left:2vw;top:4vh;width:30vw;height:44vh}
  .c2{left:2vw;top:52vh;width:30vw;height:44vh}
  .c3{left:68vw;top:4vh;width:30vw;height:44vh}
  .c4{left:68vw;top:52vh;width:30vw;height:44vh}
}
.card.big{left:3vw!important;top:3vh!important;width:94vw!important;height:94vh!important;z-index:40}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="cords" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="hdr">
  <h1>Transformationsweg</h1>
  <div class="sub">Startseite · die Punkte auf dem Band führen zu den Werkzeugen</div>
  <div id="ctl">
    <button id="bSpin" aria-pressed="true">Rotation</button>
    <button id="bReset">Zurücksetzen</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Inhalte: hier Titel und Adressen ändern. t = Lage des Punkts auf der Schleife (0 bis 1; 0, 1/3, 2/3 sind die Ecken) =====
const LINKS=[
  {title:"Transformationsweg",url:"https://t0dysseus.github.io/transformationsweg/weg",t:0},
  {title:"Generator",url:"https://t0dysseus.github.io/transformationsweg/generator",t:1/3},
  {title:"Plakat-Generator",url:"https://t0dysseus.github.io/transformationsweg/plakat_generator",t:2/3},
  // Adresse vermutet nach dem Muster der anderen: bitte prüfen
  {title:"Kompetenznachweis-Generator",url:"https://t0dysseus.github.io/transformationsweg/kompetenznachweisgenerator",t:5/6}
];

// ===== Schleife: Dreiecks-Band mit drei Halbdrehungen, schwarzer Hintergrund, weißes Raster =====
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setClearColor(0x000000,1);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const TAU=Math.PI*2;
const group=new THREE.Group();scene.add(group);

const S=0.62,A=0.4,N=18,HW=0.12,K=3,U=420,V=10;
const pt=t=>V3(S*(2*Math.cos(t)+A*Math.cos(2*t)),S*(2*Math.sin(t)-A*Math.sin(2*t)),0);
const prof=x=>x+0.1*Math.sin(6*Math.PI*x)/Math.PI;
const curve=new THREE.CatmullRomCurve3(Array.from({length:N},(_,q)=>pt(q/N*TAU)),true,"centripetal");
const C=[],T=[],Uv=[];
for(let i=0;i<U;i++)C.push(curve.getPoint(i/U));
C.push(C[0].clone());
for(let i=0;i<=U;i++)T.push(C[(i+1)%U].clone().sub(C[(i+U-1)%U]).normalize());
const u0=V3(0,0,1).addScaledVector(T[0],-T[0].z).normalize();
Uv.push(u0.clone());
const uu=u0.clone();
for(let i=1;i<=U;i++){uu.addScaledVector(T[i],-uu.dot(T[i])).normalize();Uv.push(uu.clone());}
const delta=Math.atan2(T[0].dot(new THREE.Vector3().crossVectors(Uv[0],Uv[U])),Uv[0].dot(Uv[U]));
const target=K*Math.PI-delta,phiEnd=target+TAU*Math.round((K*Math.PI-target)/TAU);
const posArr=new Float32Array((U+1)*(V+1)*3),idx=[];
for(let i=0;i<U;i++)for(let j=0;j<V;j++){const a=i*(V+1)+j,b=a+V+1;idx.push(a,b,a+1,b,b+1,a+1);}
for(let i=0;i<=U;i++){
  const ph=phiEnd*prof(i/U);
  const w=Uv[i].clone().multiplyScalar(Math.cos(ph)).addScaledVector(new THREE.Vector3().crossVectors(T[i],Uv[i]),Math.sin(ph));
  for(let j=0;j<=V;j++){const v=(-1+2*j/V)*HW,o=(i*(V+1)+j)*3;posArr[o]=C[i].x+w.x*v;posArr[o+1]=C[i].y+w.y*v;posArr[o+2]=C[i].z+w.z*v;}
}
const g=new THREE.BufferGeometry();
g.setAttribute("position",new THREE.BufferAttribute(posArr,3));g.setIndex(idx);
// unsichtbarer Tiefenpuffer, damit die Rückseite des Bandes verdeckt wird
const occ=new THREE.Mesh(g,new THREE.MeshBasicMaterial({colorWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
occ.frustumCulled=false;group.add(occ);
const band=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0.85}));
band.frustumCulled=false;group.add(band);

// ===== Fenster (iframes) fest am Bildschirm, Punkte mit Linien auf der Schleife =====
const cards=[],NS="http://www.w3.org/2000/svg",svg=document.getElementById("cords");
const toggleBig=i=>{cards.forEach((c,k)=>{if(k===i)c.classList.toggle("big");else c.classList.remove("big");c._big.textContent=c.classList.contains("big")?"✕":"⤢";});};
const nodes=LINKS.map((L,i)=>{
  const card=document.createElement("div");card.className="card c"+(i+1);
  const bar=document.createElement("div");bar.className="bar";
  const num=document.createElement("span");num.className="num";num.textContent=i+1;
  const ttl=document.createElement("span");ttl.className="ttl";ttl.textContent=L.title;
  const big=document.createElement("button");big.className="b";big.type="button";big.textContent="⤢";big.title="Vergrößern";big.setAttribute("aria-label","Vergrößern");
  big.onclick=()=>toggleBig(i);
  const open=document.createElement("a");open.className="b";open.href=L.url;open.target="_blank";open.rel="noopener noreferrer";open.textContent="↗";open.title="In neuem Tab öffnen";open.setAttribute("aria-label","In neuem Tab öffnen");
  bar.append(num,ttl,big,open);
  const fr=document.createElement("iframe");fr.src=L.url;fr.title=L.title;fr.referrerPolicy="no-referrer";
  fr.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-presentation");
  card.append(bar,fr);document.body.appendChild(card);cards.push(card);card._big=big;
  const line=document.createElementNS(NS,"line");
  line.setAttribute("stroke","#2C8CBE");line.setAttribute("stroke-width","1.5");line.setAttribute("stroke-opacity",".8");line.setAttribute("stroke-linecap","round");
  const gn=document.createElementNS(NS,"g");gn.setAttribute("class","node");
  const c=document.createElementNS(NS,"circle");c.setAttribute("r","11");c.setAttribute("fill","#000");c.setAttribute("stroke","#4cc9f0");c.setAttribute("stroke-width","2");
  const tx=document.createElementNS(NS,"text");tx.setAttribute("text-anchor","middle");tx.setAttribute("dy","4");tx.setAttribute("fill","#e8fbff");tx.setAttribute("font-size","12");tx.setAttribute("font-weight","600");tx.setAttribute("font-family","IBM Plex Sans, system-ui, sans-serif");tx.textContent=i+1;
  gn.append(c,tx);gn.addEventListener("click",()=>toggleBig(i));
  svg.append(line,gn);
  return {line,gn,local:curve.getPoint(L.t)};
});
addEventListener("keydown",e=>{if(e.key==="Escape"){cards.forEach(c=>{c.classList.remove("big");c._big.textContent="⤢";});}});

// ===== Ansicht =====
const R0=0.35;
let rx=R0,ry=0,zf=1,spin=true,drag=false,lx=0,ly=0,fitDist=9,land=true,last=performance.now();
const bSpin=document.getElementById("bSpin");
bSpin.onclick=()=>{spin=bSpin.getAttribute("aria-pressed")!=="true";bSpin.setAttribute("aria-pressed",spin);};
document.getElementById("bReset").onclick=()=>{rx=R0;ry=0;zf=1;spin=true;bSpin.setAttribute("aria-pressed","true");};
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";});
canvas.addEventListener("pointermove",e=>{if(!drag)return;ry+=(e.clientX-lx)*0.01;rx+=(e.clientY-ly)*0.01;lx=e.clientX;ly=e.clientY;});
canvas.addEventListener("pointerup",()=>{drag=false;canvas.style.cursor="grab";});
canvas.addEventListener("pointercancel",()=>{drag=false;canvas.style.cursor="grab";});
canvas.addEventListener("wheel",e=>{e.preventDefault();zf=Math.min(2,Math.max(0.5,zf+e.deltaY*0.001));},{passive:false});
// Schleife in die freie Fläche zwischen den Fenstern setzen
function layout(){
  const a=innerWidth/innerHeight;land=a>=1.15;
  renderer.setSize(innerWidth,innerHeight,false);camera.aspect=a;camera.updateProjectionMatrix();
  const f=2*Math.tan(Math.PI/8),D=3.6;
  const fw=land?0.34:0.9,fh=land?0.8:0.24;
  fitDist=Math.max(D/(fw*f*a),D/(fh*f));
  const halfH=fitDist*Math.tan(Math.PI/8),halfW=halfH*a;
  group.position.set(0,(land?-0.1:0.55)*halfH,0);
}
addEventListener("resize",layout);layout();

const tmp=V3(0,0,0);
(function loop(){requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-last)/1000,0.1);last=now;
  if(spin&&!drag)ry+=dt*0.24;
  group.rotation.set(rx,ry,0);
  camera.position.set(0,0,fitDist*zf);camera.lookAt(0,0,0);camera.updateMatrixWorld();
  group.updateMatrixWorld(true);
  const W=innerWidth,H=innerHeight,anyBig=cards.some(c=>c.classList.contains("big"));
  nodes.forEach((n,i)=>{
    tmp.copy(n.local);group.localToWorld(tmp);tmp.project(camera);
    const x=(tmp.x+1)/2*W,y=(1-tmp.y)/2*H;
    n.gn.setAttribute("transform","translate("+x+","+y+")");
    n.gn.style.display=anyBig?"none":"";
    if(land&&!anyBig){
      const r=cards[i].getBoundingClientRect(),ax=i<2?r.right:r.left,ay=r.top+r.height/2;
      n.line.setAttribute("x1",x);n.line.setAttribute("y1",y);n.line.setAttribute("x2",ax);n.line.setAttribute("y2",ay);
      n.line.style.display="";
    }else n.line.style.display="none";
  });
  renderer.render(scene,camera);})();
</script>
</body>
</html>
