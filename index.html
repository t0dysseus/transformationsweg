<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformationsweg: Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--plex:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--atk:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--neon:#2C8CBE;--cyan:#4cc9f0;--ink:#e8fbff}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:var(--atk);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cords{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#cords .node{pointer-events:auto;cursor:pointer}
#cords .node circle{filter:drop-shadow(0 0 5px #4cc9f0)}
#cords line{filter:drop-shadow(0 0 4px #2C8CBE)}

.card{
  position:fixed;z-index:4;display:flex;flex-direction:column;box-sizing:border-box;
  background:rgba(6,10,16,.94);border:1px solid var(--neon);border-radius:14px;
  overflow:hidden;box-shadow:0 0 24px rgba(44,140,190,.34);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(14px) scale(.94);
  transition:
    opacity .46s cubic-bezier(.22,1,.36,1) var(--d,0ms),
    transform .52s cubic-bezier(.22,1,.36,1) var(--d,0ms),
    visibility 0s linear .52s;
}
.card.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translateY(0) scale(1);
  transition:
    opacity .46s cubic-bezier(.22,1,.36,1) var(--d,0ms),
    transform .52s cubic-bezier(.22,1,.36,1) var(--d,0ms),
    visibility 0s linear 0s;
}
.card.closing{
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(10px) scale(.96);
  transition:
    opacity .32s cubic-bezier(.4,0,.2,1) var(--dc,0ms),
    transform .36s cubic-bezier(.4,0,.2,1) var(--dc,0ms),
    visibility 0s linear .36s;
}

.card .bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;font:700 14px var(--atk);color:var(--ink)}
.card .num{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cyan);color:var(--cyan);font:600 12px var(--plex)}
.card .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .b{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--neon);border-radius:999px;background:#0b0f14;color:var(--ink);font:400 15px var(--atk);text-decoration:none;cursor:pointer;padding:0;transition:border-color .2s ease,background .2s ease}
.card .b:hover{border-color:#fff;background:#132030}
.card iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}

/* Hochformat: Schleife oben, Fenster als 2x2-Raster darunter */
.c1{left:2vw;top:36vh;width:47vw;height:29vh;--d:0ms;--dc:165ms}
.c2{left:51vw;top:36vh;width:47vw;height:29vh;--d:165ms;--dc:110ms}
.c3{left:2vw;top:67vh;width:47vw;height:29vh;--d:330ms;--dc:55ms}
.c4{left:51vw;top:67vh;width:47vw;height:29vh;--d:495ms;--dc:0ms}

/* Querformat: Schleife in der Mitte, je zwei Fenster links und rechts */
@media (min-aspect-ratio:115/100){
  .c1{left:2vw;top:4vh;width:30vw;height:44vh;--d:0ms;--dc:165ms}
  .c2{left:2vw;top:52vh;width:30vw;height:44vh;--d:165ms;--dc:110ms}
  .c3{left:68vw;top:4vh;width:30vw;height:44vh;--d:330ms;--dc:55ms}
  .c4{left:68vw;top:52vh;width:30vw;height:44vh;--d:495ms;--dc:0ms}
}
.card.big{left:3vw!important;top:3vh!important;width:94vw!important;height:94vh!important;z-index:40;--d:0ms;--dc:0ms}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="cords" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LINKS=[
  {title:"Transformationsweg",url:"https://t0dysseus.github.io/transformationsweg/weg",t:0},
  {title:"Generator",url:"https://t0dysseus.github.io/transformationsweg/generator",t:1/3},
  {title:"Plakat-Generator",url:"https://t0dysseus.github.io/transformationsweg/plakat_generator",t:2/3},
  {title:"Kompetenznachweis-Generator",url:"https://t0dysseus.github.io/transformationsweg/kompetenznachweisgenerator",t:5/6}
];

const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setClearColor(0x000000,1);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const TAU=Math.PI*2;
const group=new THREE.Group();scene.add(group);

const S=0.62,A=0.4,N=18,HW=0.12,K=3,U=420,V=10;
const pt=t=>V3(S*(2*Math.cos(t)+A*Math.cos(2*t)),S*(2*Math.sin(t)-A*Math.sin(2*t)),0);
const prof=x=>x+0.1*Math.sin(6*Math.PI*x)/Math.PI;
const curve=new THREE.CatmullRomCurve3(Array.from({length:N},(_,q)=>pt(q/N*TAU)),true,"centripetal");
const C=[],T=[],Uv=[],Ws=[];
for(let i=0;i<U;i++)C.push(curve.getPoint(i/U));
C.push(C[0].clone());
for(let i=0;i<=U;i++)T.push(C[(i+1)%U].clone().sub(C[(i+U-1)%U]).normalize());
const u0=V3(0,0,1).addScaledVector(T[0],-T[0].z).normalize();
Uv.push(u0.clone());
const uu=u0.clone();
for(let i=1;i<=U;i++){uu.addScaledVector(T[i],-uu.dot(T[i])).normalize();Uv.push(uu.clone());}
const delta=Math.atan2(T[0].dot(new THREE.Vector3().crossVectors(Uv[0],Uv[U])),Uv[0].dot(Uv[U]));
const target=K*Math.PI-delta,phiEnd=target+TAU*Math.round((K*Math.PI-target)/TAU);
const posArr=new Float32Array((U+1)*(V+1)*3),idx=[];
for(let i=0;i<U;i++)for(let j=0;j<V;j++){const a=i*(V+1)+j,b=a+V+1;idx.push(a,b,a+1,b,b+1,a+1);}
for(let i=0;i<=U;i++){
  const ph=phiEnd*prof(i/U);
  const w=Uv[i].clone().multiplyScalar(Math.cos(ph)).addScaledVector(new THREE.Vector3().crossVectors(T[i],Uv[i]),Math.sin(ph));
  Ws.push(w.clone());
  for(let j=0;j<=V;j++){const v=(-1+2*j/V)*HW,o=(i*(V+1)+j)*3;posArr[o]=C[i].x+w.x*v;posArr[o+1]=C[i].y+w.y*v;posArr[o+2]=C[i].z+w.z*v;}
}
const g=new THREE.BufferGeometry();
g.setAttribute("position",new THREE.BufferAttribute(posArr,3));g.setIndex(idx);
const occ=new THREE.Mesh(g,new THREE.MeshBasicMaterial({colorWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
occ.frustumCulled=false;group.add(occ);
const band=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0.85}));
band.frustumCulled=false;group.add(band);

let twistValue=3,twistStart=3,twistTarget=3,twistElapsed=0;
function updateTwist(turns){
  const endAngle=turns*Math.PI-delta;
  for(let i=0;i<=U;i++){
    const ph=endAngle*prof(i/U);
    const w=Uv[i].clone().multiplyScalar(Math.cos(ph)).addScaledVector(new THREE.Vector3().crossVectors(T[i],Uv[i]),Math.sin(ph));
    Ws[i].copy(w);
    for(let j=0;j<=V;j++){
      const v=(-1+2*j/V)*HW,o=(i*(V+1)+j)*3;
      posArr[o]=C[i].x+w.x*v;posArr[o+1]=C[i].y+w.y*v;posArr[o+2]=C[i].z+w.z*v;
    }
  }
  g.attributes.position.needsUpdate=true;
  g.computeBoundingSphere();
}

const cutPos=new Float32Array((2*U+1)*(V+1)*3),cutIdx=[];
for(let i=0;i<2*U;i++)for(let j=0;j<V;j++){const a=i*(V+1)+j,b=a+V+1;cutIdx.push(a,b,a+1,b,b+1,a+1);}
const cutGeometry=new THREE.BufferGeometry();
cutGeometry.setAttribute("position",new THREE.BufferAttribute(cutPos,3));
cutGeometry.setIndex(cutIdx);
const cutMaterial=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0,side:THREE.DoubleSide});
const cutBand=new THREE.Mesh(cutGeometry,cutMaterial);cutBand.frustumCulled=false;group.add(cutBand);
function buildCutBand(){
  const path=[],sideNormals=[],edge=HW*0.72;
  for(let i=0;i<=U;i++){
    path.push(C[i].clone().addScaledVector(Ws[i],edge));
    sideNormals.push(new THREE.Vector3().crossVectors(T[i],Ws[i]).normalize());
  }
  for(let i=0;i<=U;i++){
    path.push(C[i].clone().addScaledVector(Ws[i],-edge));
    sideNormals.push(new THREE.Vector3().crossVectors(T[i],Ws[i]).normalize().negate());
  }
  const tangents=[];
  for(let i=0;i<=2*U;i++){
    const prev=path[(i+2*U-1)%(2*U)],next=path[(i+1)%(2*U)];
    tangents.push(next.clone().sub(prev).normalize());
  }
  for(let i=0;i<=2*U;i++){
    const n=sideNormals[i].clone().addScaledVector(tangents[i],-sideNormals[i].dot(tangents[i])).normalize();
    for(let j=0;j<=V;j++){
      const v=(-1+2*j/V)*HW*0.48,o=(i*(V+1)+j)*3;
      const q=path[i].clone().addScaledVector(n,v);
      cutPos[o]=q.x;cutPos[o+1]=q.y;cutPos[o+2]=q.z;
    }
  }
  cutGeometry.attributes.position.needsUpdate=true;cutGeometry.computeBoundingSphere();
}
buildCutBand();
let cutMix=0,cutTarget=0;

const ball=new THREE.Mesh(
  new THREE.SphereGeometry(0.045,24,16),
  new THREE.MeshStandardMaterial({color:0x4cc9f0,emissive:0x12384a,roughness:0.28,metalness:0.12})
);
ball.visible=false;group.add(ball);
let ballPhase=0;

const pulseNodes=LINKS.map(L=>L.t);
const pulses=Array.from({length:4},(_,i)=>{
  const pulseGroup=new THREE.Group();
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.085,20,12),new THREE.MeshBasicMaterial({color:0x2c8cbe,transparent:true,opacity:0.16,depthWrite:false}));
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.032,20,12),new THREE.MeshBasicMaterial({color:0x9beaff,transparent:true,opacity:0.9}));
  pulseGroup.add(halo,core);pulseGroup.visible=false;group.add(pulseGroup);
  return {group:pulseGroup,halo,core,phase:i/4,energy:[0.95,0.45,0.7,0.3][i]};
});
let pulsesActive=false;
const nodeFlash=LINKS.map(()=>0);
const crossedPhase=(from,to,at)=>to>=from?(at>from&&at<=to):(at>from||at<=to);
function updatePulse(pulse){
  const f=pulse.phase*U,i=Math.min(U-1,Math.floor(f)),a=f-i;
  const p=C[i].clone().lerp(C[i+1],a);
  const w=Ws[i].clone().lerp(Ws[i+1],a).normalize();
  pulse.group.position.copy(p).addScaledVector(w,HW*0.62);
  pulse.core.material.opacity=0.45+Math.min(1,pulse.energy)*0.5;
  pulse.halo.material.opacity=0.06+Math.min(1.4,pulse.energy)*0.16;
  pulse.group.scale.setScalar(0.82+Math.min(1.2,pulse.energy)*0.22);
}

const cards=[],NS="http://www.w3.org/2000/svg",svg=document.getElementById("cords");
const floatPhases=LINKS.map((_,i)=>i*1.35);
const cordProgress=LINKS.map(()=>0);
const STAGGER_OPEN_SEC=0.165;
const STAGGER_CLOSE_SEC=0.055;
const cardGate=LINKS.map(()=>0);

let qOpen=false,bandDock=0,dockDelayTimer=0,pendingOpenCards=false,pendingUndock=false,seqTimers=[];
function clearSeqTimers(){seqTimers.forEach(id=>clearTimeout(id));seqTimers=[];}

const toggleBig=i=>{
  cards.forEach((c,k)=>{
    if(k===i)c.classList.toggle("big");else c.classList.remove("big");
    c._big.textContent=c.classList.contains("big")?"✕":"⤢";
  });
};

const nodes=LINKS.map((L,i)=>{
  const card=document.createElement("div");card.className="card c"+(i+1);
  const bar=document.createElement("div");bar.className="bar";
  const num=document.createElement("span");num.className="num";num.textContent=i+1;
  const ttl=document.createElement("span");ttl.className="ttl";ttl.textContent=L.title;
  const big=document.createElement("button");big.className="b";big.type="button";big.textContent="⤢";big.title="Vergrößern";big.setAttribute("aria-label","Vergrößern");
  big.onclick=()=>toggleBig(i);
  const open=document.createElement("a");open.className="b";open.href=L.url;open.target="_blank";open.rel="noopener noreferrer";open.textContent="↗";open.title="In neuem Tab öffnen";open.setAttribute("aria-label","In neuem Tab öffnen");
  bar.append(num,ttl,big,open);
  const fr=document.createElement("iframe");fr.src=L.url;fr.title=L.title;fr.referrerPolicy="no-referrer";
  fr.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-presentation");
  card.append(bar,fr);document.body.appendChild(card);cards.push(card);card._big=big;

  const line=document.createElementNS(NS,"line");
  line.setAttribute("stroke","#2C8CBE");line.setAttribute("stroke-width","1.5");line.setAttribute("stroke-opacity",".82");line.setAttribute("stroke-linecap","round");
  const gn=document.createElementNS(NS,"g");gn.setAttribute("class","node");
  const c=document.createElementNS(NS,"circle");c.setAttribute("r","11");c.setAttribute("fill","#000");c.setAttribute("stroke","#4cc9f0");c.setAttribute("stroke-width","2");
  const tx=document.createElementNS(NS,"text");tx.setAttribute("text-anchor","middle");tx.setAttribute("dy","4");tx.setAttribute("fill","#e8fbff");tx.setAttribute("font-size","12");tx.setAttribute("font-weight","600");tx.setAttribute("font-family","IBM Plex Sans, system-ui, sans-serif");tx.textContent=i+1;
  gn.append(c,tx);
  gn.addEventListener("click",()=>{if(!qOpen)triggerQ(true);toggleBig(i);});
  svg.append(line,gn);
  return {line,gn,circle:c,local:curve.getPoint(L.t),t:L.t};
});

function openCardsSequence(){
  clearSeqTimers();
  cards.forEach((card,i)=>{
    card.classList.remove("closing");
    const tid=setTimeout(()=>{
      if(!qOpen)return;
      void card.offsetWidth;
      card.classList.add("open");
      nodeFlash[i]=Math.max(nodeFlash[i],0.75);
    },i*STAGGER_OPEN_SEC*1000);
    seqTimers.push(tid);
  });
}

function closeCardsSequence(){
  clearSeqTimers();
  cards.forEach((card,i)=>{
    card.classList.remove("big","open");
    card._big.textContent="⤢";
    const tid=setTimeout(()=>{
      void card.offsetWidth;
      card.classList.add("closing");
    },(cards.length-1-i)*STAGGER_CLOSE_SEC*1000);
    seqTimers.push(tid);
  });
}

function triggerQ(forceState){
  qOpen=(typeof forceState==="boolean")?forceState:!qOpen;
  clearSeqTimers();
  if(qOpen){
    pendingUndock=false;pendingOpenCards=true;dockDelayTimer=0.28;
    cards.forEach(card=>{card.classList.remove("big","open","closing");card._big.textContent="⤢";});
  }else{
    pendingOpenCards=false;pendingUndock=true;dockDelayTimer=0.34+cards.length*STAGGER_CLOSE_SEC;
    closeCardsSequence();
  }
}

addEventListener("keydown",e=>{
  if(e.key==="Escape")cards.forEach(c=>{c.classList.remove("big");c._big.textContent="⤢";});
  const tag=e.target?.tagName?.toLowerCase();
  if(tag==="input"||tag==="textarea"||e.target?.isContentEditable||e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==="ü"){ball.visible=!ball.visible;if(ball.visible)ballPhase=0;}
  if(k==="ä")cutTarget=cutTarget?0:1;
  if(k==="ö"){cutTarget=0;twistStart=twistValue;twistTarget=twistTarget>1.5?0:3;twistElapsed=0;}
  if(k==="q")triggerQ();
  if(k==="p"){
    pulsesActive=!pulsesActive;
    pulses.forEach(p=>{p.group.visible=pulsesActive;});
    if(pulsesActive){pulses.forEach((p,i)=>{p.phase=i/4;p.energy=[0.95,0.45,0.7,0.3][i];});nodeFlash.fill(0);}
  }
});

const R0=0.35;
let rx=R0,ry=0,zf=1,spin=true,drag=false,moved=false,dx0=0,dy0=0,lx=0,ly=0,fitDist=9,land=true,last=performance.now();
canvas.addEventListener("pointerdown",e=>{drag=true;moved=false;dx0=lx=e.clientX;dy0=ly=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";});
canvas.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(Math.hypot(e.clientX-dx0,e.clientY-dy0)>6)moved=true;
  ry+=(e.clientX-lx)*0.01;rx+=(e.clientY-ly)*0.01;lx=e.clientX;ly=e.clientY;
});
canvas.addEventListener("pointerup",()=>{
  const wasClick=drag&&!moved;
  drag=false;canvas.style.cursor="grab";
  if(wasClick)triggerQ();
});
canvas.addEventListener("pointercancel",()=>{drag=false;canvas.style.cursor="grab";});
document.addEventListener("click",e=>{
  if(e.target===canvas||e.target.closest(".card, #cords .node"))return;
  triggerQ();
});
canvas.addEventListener("wheel",e=>{e.preventDefault();zf=Math.min(2,Math.max(0.5,zf+e.deltaY*0.001));},{passive:false});

function layout(){
  const a=innerWidth/innerHeight;land=a>=1.15;
  renderer.setSize(innerWidth,innerHeight,false);camera.aspect=a;camera.updateProjectionMatrix();
  const f=2*Math.tan(Math.PI/8),D=3.6;
  const fw=land?0.34:0.9,fh=land?0.8:0.24;
  fitDist=Math.max(D/(fw*f*a),D/(fh*f));
  const halfH=fitDist*Math.tan(Math.PI/8);
  group.position.set(0,(land?-0.1:0.55)*halfH,0);
}
addEventListener("resize",layout);layout();

const tmp=V3(0,0,0);
(function loop(){requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-last)/1000,0.1);last=now;
  if(spin&&!drag)ry+=dt*0.24;

  cutMix+=((cutTarget?1:0)-cutMix)*Math.min(1,dt*2.2);
  cutMaterial.opacity=cutMix*0.85;
  if(Math.abs(twistTarget-twistValue)>0.0001){
    twistElapsed=Math.min(3.2,twistElapsed+dt);
    const q=twistElapsed/3.2,ease=q*q*(3-2*q);
    twistValue=twistStart+(twistTarget-twistStart)*ease;
    updateTwist(twistValue);
  }
  band.material.opacity=0.85*(1-cutMix);
  occ.visible=cutMix<0.5;
  cutBand.visible=cutMix>0.01;

  if(ball.visible){
    ballPhase=(ballPhase+dt*0.12)%1;
    const f=ballPhase*U,i=Math.floor(f),a=f-i;
    const p=C[i].clone().lerp(C[i+1],a);
    const w=Ws[i].clone().lerp(Ws[i+1],a).normalize();
    ball.position.copy(p).addScaledVector(w,HW*0.72);
  }

  if(pulsesActive){
    pulses.forEach((pulse,pi)=>{
      const oldPhase=pulse.phase;
      pulse.phase=(pulse.phase+dt*0.075)%1;
      pulseNodes.forEach((at,ni)=>{
        if(crossedPhase(oldPhase,pulse.phase,at)){
          const transfer=Math.min(0.14,pulse.energy*0.2);
          pulse.energy=Math.max(0.12,pulse.energy-transfer);
          const receiver=pulses[(pi+1)%pulses.length];
          receiver.energy=Math.min(1.4,receiver.energy+transfer);
          nodeFlash[ni]=1;
        }
      });
      updatePulse(pulse);
    });
  }

  bandDock+=((qOpen?1:0)-bandDock)*(1-Math.exp(-dt*4.5));
  if(pendingOpenCards){dockDelayTimer-=dt;if(dockDelayTimer<=0||bandDock>0.78){pendingOpenCards=false;openCardsSequence();}}
  if(pendingUndock){dockDelayTimer-=dt;if(dockDelayTimer<=0)pendingUndock=false;}

  const nowSec=now*0.001;
  nodes.forEach((n,i)=>{
    nodeFlash[i]=Math.max(0,nodeFlash[i]-dt*2.4);
    const glow=5+nodeFlash[i]*18;
    n.circle.style.filter="drop-shadow(0 0 "+glow+"px #4cc9f0) brightness("+(1+nodeFlash[i]*1.6)+")";
    n.circle.setAttribute("r",String(11+nodeFlash[i]*2.8));
  });

  group.rotation.set(rx,ry,0);
  camera.position.set(0,0,fitDist*zf);camera.lookAt(0,0,0);camera.updateMatrixWorld();
  group.updateMatrixWorld(true);

  const W=innerWidth,H=innerHeight,anyBig=cards.some(c=>c.classList.contains("big"));
  nodes.forEach((n,i)=>{
    const f=n.t*U,ci=Math.min(U-1,Math.floor(f)),a=f-ci;
    tmp.copy(C[ci]).lerp(C[ci+1],a);
    group.localToWorld(tmp);tmp.project(camera);
    const bx=(tmp.x+1)/2*W,by=(1-tmp.y)/2*H;
    const ph=floatPhases[i]+nowSec*0.6;
    const fx=bx+Math.cos(ph*1.2+i)*Math.min(65,W*0.055);
    const fy=by+Math.sin(ph*1.6+i*1.4)*Math.min(50,H*0.055);
    const x=fx+(bx-fx)*bandDock,y=fy+(by-fy)*bandDock;

    n.gn.setAttribute("transform","translate("+x+","+y+")");
    n.gn.style.display=anyBig?"none":"";

    const isThisOpen=qOpen&&!pendingOpenCards&&!anyBig&&cards[i].classList.contains("open");
    cardGate[i]+=((isThisOpen?1:0)-cardGate[i])*(1-Math.exp(-dt*14));
    cordProgress[i]+=(cardGate[i]-cordProgress[i])*(1-Math.exp(-dt*8));

    if(land&&!anyBig&&cordProgress[i]>0.02){
      const r=cards[i].getBoundingClientRect(),ax=i<2?r.right:r.left,ay=r.top+r.height/2;
      const lx2=x+(ax-x)*cordProgress[i],ly2=y+(ay-y)*cordProgress[i];
      n.line.setAttribute("x1",x);n.line.setAttribute("y1",y);n.line.setAttribute("x2",lx2);n.line.setAttribute("y2",ly2);
      n.line.setAttribute("stroke-opacity",String(0.82*cordProgress[i]));
      n.line.style.display="";
    }else n.line.style.display="none";
  });

  renderer.render(scene,camera);
})();
</script>
