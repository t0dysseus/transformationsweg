<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kompetenznachweis-Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--bd:#d9dce2;--ac:#2b6b9b;--acf:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;--ac:#5aa3d6;--acf:#0b1a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--fg:#eceef2;--mut:#9aa1ad;--bd:#3a3d44;--ac:#5aa3d6;--acf:#0b1a26;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:760px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button,select,.fbtn{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5}
label.l{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
textarea,input[type=text]{width:100%;font:inherit;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
.sl{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.cols label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
details summary{cursor:pointer;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.stage{position:sticky;top:12px;align-self:start}
#cv{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.25);touch-action:none;cursor:grab;background:#fff}
#msg{font-size:13px;color:var(--mut);min-height:1.4em;text-align:center;margin-top:8px}
details.adv>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--fg)}
.adv h2{margin-top:18px}.adv[open]>summary{margin-bottom:4px}
.big{width:100%;padding:12px;font-size:16px;border-radius:12px}
#texts label.l:first-child{margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <div class="stage"><canvas id="cv"></canvas></div>
  <div>
    <div class="card"><h1>Kompetenznachweis-Generator</h1><div id="texts"></div><div class="row"><button class="pri big" id="bPdf">PDF erstellen</button></div><div id="msg"></div></div>
    <details class="card adv"><summary>Erweiterte Möglichkeiten</summary>
      <h2>Verschieben und Größe</h2><div class="chips" id="chips"></div><div id="fields"></div>
      <h2>Schrift</h2><div class="row"><label style="font-size:12px;color:var(--mut)">Titel <select id="fT"><option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option><option value="Arial">Helvetica / Arial</option><option value="IBM Plex Sans">IBM Plex Sans</option><option value="Archivo Black">Archivo Black</option></select></label>
      <label style="font-size:12px;color:var(--mut)">Text <select id="fB"><option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option><option value="Arial">Helvetica / Arial</option><option value="IBM Plex Sans">IBM Plex Sans</option></select></label></div>
      <h2>Farben</h2><div class="cols" id="cols"></div>
      <h2>Ausgabe</h2><div class="row"><label style="font-size:12px;color:var(--mut)">Format <select id="fmt"><option value="a5">A5</option><option value="a4" selected>A4</option><option value="a3">A3</option></select></label></div>
      <div class="row"><button id="bPng">PNG speichern</button><button id="bReset">Zurücksetzen</button></div>
    </details>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const adv=document.querySelector('details.adv');
//#CORE-START
// ---- Kern: Layout nach Designvorlage (weißes Plakat, Drahtgitter-Bänder, hellblaue Fußleiste) ----
const TH={bg:'#15151a',title:'#ffffff',text:'#ffffff',ribA:'#e6e6ee',ribB:'#e6e6ee',ribC:'#3cb0ff',band:'#16314a',logo:'#9fb8cc',logoTx:'#ffffff',foot:'#ffffff',line:'#ffffff'};
const CL={bg:'Hintergrund',title:'Titel',text:'Text',ribA:'Band 1 (Netz)',ribB:'Band 2 (Netz)',ribC:'Band 3 (Netz)',band:'Fußleiste',logo:'Logo Netz',logoTx:'Logo Text',foot:'Fußzeile',line:'Unterschriftslinie'};
const DEF=()=>({fT:'Atkinson Hyperlegible',fB:'Atkinson Hyperlegible',fmt:'a4',sel:'title',
 tx:{title:'Kompetenz-\nnachweis',sub:'CJD Hackathon',name:'Max\nMustermann',date:'1., 5. und 9.12.2026',event:'CJD Hackathon',thema:'Thema des Hackathons',focus:'Konzeption\nTeamarbeit\nKommunikation\nPräsentation',free:'',signName:'Vorname Nachname',signRole:'',logo:'Räume\nfür Jeden',foot:'In Zusammenarbeit mit dem Masterstudiengang Transformation Design & Print der BHT'},
 pos:{title:{x:55.7,y:6.3,s:1},sub:{x:55.7,y:18.2,s:1},name:{x:3.3,y:65,s:1},body:{x:55.7,y:64.5,s:1},sign:{x:55.7,y:83,s:1},logo:{x:7.7,y:92.8,s:1},foot:{x:1.2,y:99.3,s:1},ribA:{x:0,y:0,s:1},ribB:{x:0,y:0,s:1},ribC:{x:0,y:0,s:1}},
 th:Object.assign({},TH)});
let S=DEF();
try{const o4=localStorage.getItem('kompetenz-gen4'),j=JSON.parse(o4||localStorage.getItem('kompetenz-gen3')||localStorage.getItem('kompetenz-gen2')||'null');if(j&&!o4){delete j.fT;delete j.fB;delete j.theme;delete j.th}if(j){for(const k of['tx','pos','th'])for(const a in j[k]||{})S[k][a]=(typeof j[k][a]==='object')?Object.assign(S[k][a]||{},j[k][a]):j[k][a];for(const k of['fT','fB','fmt'])if(j[k]!==undefined)S[k]=j[k]}}catch(e){}
const save=()=>{try{const{sel,...r}=S;localStorage.setItem('kompetenz-gen4',JSON.stringify(r))}catch(e){}};
const FONTS={'Arial':{css:'"Helvetica Neue",Helvetica,Arial,sans-serif',ls:-.01},'IBM Plex Sans':{css:'"IBM Plex Sans",Arial,Helvetica,sans-serif',ls:-.012},'Atkinson Hyperlegible':{css:'"Atkinson Hyperlegible",Arial,Helvetica,sans-serif',ls:-.01},'Archivo Black':{css:'"Archivo Black","Arial Black",Impact,sans-serif',ls:-.02}};
const FD=f=>FONTS[f]||FONTS.Arial;
const F2=(f,px,w)=>(f==='Archivo Black'?400:w)+' '+px+'px '+FD(f).css;
const lines=t=>String(t).split('\n').map(s=>s.trim()).filter(Boolean);

// Satz aus den Feldern (*…* = fett)
function joinFocus(a){if(a.length<2)return a[0]||'';if(a.length===2)return a[0]+' sowie '+a[1];return a.slice(0,-1).join(', ')+' sowie '+a[a.length-1]}
function bodyParas(){
 const x=S.tx;
 if((x.free||'').trim())return x.free.split(/\n+/).map(s=>s.trim()).filter(Boolean);
 const L=lines(x.focus),d=(x.date||'').trim(),e=(x.event||'').trim(),t=(x.thema||'').trim();
 return ['hat '+(d?'am *'+d+'* ':'')+(e?'am *'+e+'* ':'')+(t?'zum Thema *„'+t+'“* ':'')+'teilgenommen.'].concat(L.length?['Schwerpunkte waren *'+joinFocus(L)+'*.']:[]);
}
function wrapMarked(c,txt,maxW,fN,fH){
 const toks=[];let pend=false;
 String(txt).split('*').forEach((part,j)=>{const re=/\s+|\S+/g;let m;while((m=re.exec(part))){if(/^\s/.test(m[0]))pend=true;else{toks.push({t:m[0],hi:j%2===1,sp:pend});pend=false}}});
 c.font=fN;const sw=c.measureText(' ').width;
 toks.forEach(k=>{c.font=k.hi?fH:fN;k.w=c.measureText(k.t).width});
 const out=[];let cur={toks:[],w:0,sw:sw};
 toks.forEach(k=>{const add=(cur.toks.length&&k.sp?sw:0)+k.w;
  if(cur.toks.length&&cur.w+add>maxW&&k.sp){out.push(cur);cur={toks:[],w:0,sw:sw};cur.toks.push(k);cur.w=k.w}
  else{cur.toks.push(k);cur.w+=add}});
 if(cur.toks.length)out.push(cur);
 return out;
}

// ---- Drahtgitter-Bänder ----
// Catmull-Rom durch Punkte [x,y,z,phi] (x,y,z in Seitenbreiten, phi = Verdrehung in rad)
function crSample(P,per){
 const n=P.length,out=[];
 for(let i=0;i<n-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];
  for(let k=0;k<per;k++){const t=k/per,t2=t*t,t3=t2*t;
   out.push(p1.map((_,d)=>.5*(2*p1[d]+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)))}}
 out.push(P[n-1].slice());return out;
}
const v3={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]}};
function ribbonFromPts(P,per){
 const Q=crSample(P,per),n=Q.length,C=Q.map(q=>[q[0],q[1],q[2]]),T=[];
 for(let i=0;i<n;i++)T.push(v3.norm(v3.sub(C[Math.min(n-1,i+1)],C[Math.max(0,i-1)])));
 let nv=v3.cross(T[0],[0,0,1]);if(Math.hypot(...nv)<1e-3)nv=v3.cross(T[0],[1,0,0]);nv=v3.norm(nv);
 const Wv=[];
 for(let i=0;i<n;i++){
  if(i>0){const d=v3.dot(nv,T[i]);nv=v3.norm([nv[0]-d*T[i][0],nv[1]-d*T[i][1],nv[2]-d*T[i][2]])}
  const b=v3.cross(T[i],nv),ph=Q[i][3],cp=Math.cos(ph),sp=Math.sin(ph);
  Wv.push([nv[0]*cp+b[0]*sp,nv[1]*cp+b[1]*sp,nv[2]*cp+b[2]*sp]);
 }
 return{C,Wv};
}
// Dreiecks-Band (drei Halbdrehungen) für das Logo, geschlossen
function ribbonTriangle(n){
 const A=.4,C=[],Wv=[];
 for(let i=0;i<=n;i++){const t=i/n*Math.PI*2;
  C.push([2*Math.cos(t)+A*Math.cos(2*t),2*Math.sin(t)-A*Math.sin(2*t),0]);
  const T=v3.norm([-2*Math.sin(t)-2*A*Math.sin(2*t),2*Math.cos(t)-2*A*Math.cos(2*t),0]),nn=[-T[1],T[0],0],ph=Math.PI/2+1.5*t+.3*Math.sin(3*t);
  Wv.push([nn[0]*Math.cos(ph),nn[1]*Math.cos(ph),Math.sin(ph)]);
 }
 return{C,Wv};
}
const PF=2.2;                                   // Brennweite der Perspektive
function projFn(){return p=>{const k=PF/(PF-p[2]);return[.5+(p[0]-.5)*k,.7071+(p[1]-.7071)*k]}}
// Zeichnet das Netz: Querlinien, Längslinien, Diagonalen, kräftigere Ränder
function drawMesh(c,rb,wid,M,proj,tf,col,lw,diag,low){
 const n=rb.C.length,G=[];
 for(let i=0;i<n;i++){const row=[];for(let j=0;j<=M;j++){const o=(j/M-.5)*wid,p=[rb.C[i][0]+rb.Wv[i][0]*o,rb.C[i][1]+rb.Wv[i][1]*o,rb.C[i][2]+rb.Wv[i][2]*o];row.push(tf(proj(p)))}G.push(row)}
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 G.forEach(r=>r.forEach(p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}));
 c.strokeStyle=col;c.lineJoin='round';c.lineCap='round';
 c.lineWidth=lw;c.beginPath();
 for(let i=0;i<n;i+=(low?2:1)){c.moveTo(G[i][0][0],G[i][0][1]);c.lineTo(G[i][M][0],G[i][M][1])}
 for(let j=1;j<M;j++){c.moveTo(G[0][j][0],G[0][j][1]);for(let i=1;i<n;i++)c.lineTo(G[i][j][0],G[i][j][1])}
 if(diag&&!low)for(let i=0;i<n-1;i++)for(let j=0;j<M;j++){c.moveTo(G[i][j][0],G[i][j][1]);c.lineTo(G[i+1][j+1][0],G[i+1][j+1][1])}
 c.stroke();
 c.lineWidth=lw*2.6;c.beginPath();
 for(const j of[0,M]){c.moveTo(G[0][j][0],G[0][j][1]);for(let i=1;i<n;i++)c.lineTo(G[i][j][0],G[i][j][1])}
 c.moveTo(G[0][0][0],G[0][0][1]);c.lineTo(G[0][M][0],G[0][M][1]);c.moveTo(G[n-1][0][0],G[n-1][0][1]);c.lineTo(G[n-1][M][0],G[n-1][M][1]);
 c.stroke();
 return[x0,y0,x1,y1];
}
// Bandformen in Seitenbreiten (x 0..1, y 0..1.414), z = Tiefe, phi = Verdrehung
const RIBS={
 ribA:{wid:.13,M:12,per:16,diag:true,pts:[[-.12,.10,.05,.2],[.10,.05,.10,.9],[.22,.13,-.05,2.0],[.27,.34,.00,2.9],[.33,.52,.10,3.4],[.46,.62,.15,4.0],[.59,.71,.15,4.7],[.67,.78,.10,5.3],[.60,.85,.05,6.0],[.47,.84,.00,6.6],[.40,.78,-.05,7.2],[.48,.73,.00,7.8],[.66,.74,.08,8.3],[.86,.70,-.05,8.6],[1.12,.58,-.10,8.7]]},
 ribB:{wid:.12,M:11,per:16,diag:false,pts:[[-.12,.76,.0,.3],[.03,.64,.05,1.2],[.13,.55,.0,2.3],[.19,.68,.0,3.0],[.27,.80,.05,3.6],[.38,.85,.10,4.2],[.45,.92,.05,4.8],[.44,1.03,.0,5.2],[.45,1.14,.05,5.6],[.50,1.25,.10,6.0],[.68,1.33,.15,6.3],[.88,1.42,.25,6.5],[1.10,1.50,.30,6.6]]},
 ribC:{wid:.085,M:12,per:16,diag:true,pts:[[.36,.10,.0,0],[.45,.13,.05,1.4],[.51,.23,.0,2.8],[.43,.30,.0,4.2],[.38,.39,.05,5.6],[.45,.47,.0,7.0],[.60,.46,.05,8.2],[.66,.36,.0,9.6],[.75,.33,.0,11.0],[.82,.43,.0,12.4],[.73,.53,.05,13.4],[.60,.60,.1,14.2],[.52,.66,.15,15.0]]}
};
const ribCache={};
function ribGeom(k){return ribCache[k]||(ribCache[k]=ribbonFromPts(RIBS[k].pts,RIBS[k].per))}

function draw(c,W,H,sel,low){
 const T=S.th,u=W/810,B={},fT=S.fT,fB=S.fB;
 c.save();c.fillStyle=T.bg;c.fillRect(0,0,W,H);
 // Fußleiste unter den Bändern, Bänder darüber
 const by=.869*H;c.fillStyle=T.band;c.fillRect(0,by,W,H-by);
 c.beginPath();c.rect(0,0,W,H);c.clip();
 const proj=projFn();
 ['ribA','ribB','ribC'].forEach(k=>{
  const p=S.pos[k],R=RIBS[k],tf=q=>[((q[0]-.5)*p.s+.5)*W+p.x/100*W,((q[1]-.7071)*p.s+.7071)*W+p.y/100*H];
  B[k]=drawMesh(c,ribGeom(k),R.wid,R.M,proj,tf,T[k],Math.max(.6,.8*u),R.diag,low);
 });
 c.restore();
 // Titel (links ausgerichtet, Zeilen auf Spaltenbreite eingepasst)
 {const p=S.pos.title,L=String(S.tx.title).split('\n').map(s=>s.trim()).filter(Boolean),s=p.s,colW=.40*W*s,x=p.x/100*W,y=p.y/100*H;
  if(L.length){c.font=F2(fT,100,700);const mw=Math.max(...L.map(l=>c.measureText(l).width)),fs=Math.min(.092*W*s,100*colW/mw),lh=fs*.98;
   c.font=F2(fT,fs,700);c.fillStyle=T.title;c.textAlign='left';c.textBaseline='alphabetic';
   L.forEach((l,i)=>c.fillText(l,x,y+fs*.72+i*lh));
   let w=0;L.forEach(l=>w=Math.max(w,c.measureText(l).width));B.title=[x,y,x+w,y+fs*.72+(L.length-1)*lh+fs*.1]}}
 {const p=S.pos.sub,t=(S.tx.sub||'').trim(),fs=.032*W*p.s,x=p.x/100*W,y=p.y/100*H;
  if(t){c.font=F2(fB,fs,400);c.fillStyle=T.title;c.textAlign='left';c.textBaseline='middle';c.fillText(t,x,y);B.sub=[x,y-fs*.6,x+c.measureText(t).width,y+fs*.6]}}
 // Name groß links unten (Zeilen auf Spaltenbreite eingepasst)
 {const p=S.pos.name,L=String(S.tx.name).split('\n').map(s=>s.trim()).filter(Boolean),s=p.s,colW=.31*W*s,x=p.x/100*W,y=p.y/100*H;
  if(L.length){c.font=F2(fT,100,700);const mw=Math.max(...L.map(l=>c.measureText(l).width)),fs=Math.min(.076*W*s,100*colW/mw),lh=fs*1.14;
   c.font=F2(fT,fs,700);c.fillStyle=T.title;c.textAlign='left';c.textBaseline='middle';
   L.forEach((l,i)=>c.fillText(l,x,y+i*lh));
   let w=0;L.forEach(l=>w=Math.max(w,c.measureText(l).width));B.name=[x,y-fs*.6,x+w,y+(L.length-1)*lh+fs*.6]}}
 // Fließtext in der rechten Spalte
 {const p=S.pos.body,s=p.s,fs=.0225*W*s,lh=1.38*fs,maxW=.43*W*s,x=p.x/100*W,y=p.y/100*H,fN=F2(fB,fs,400),fH=F2(fB,fs,700),rows=[];
  bodyParas().forEach((para,pi)=>wrapMarked(c,para,maxW,fN,fH).forEach((l,li)=>rows.push({l,gap:(li===0&&pi>0)?.6*lh:0})));
  if(rows.length){let yy=y,mw=0;c.textAlign='left';c.textBaseline='middle';
   rows.forEach(r=>{yy+=r.gap;let xx=x;mw=Math.max(mw,r.l.w);
    r.l.toks.forEach((tk,i)=>{if(i>0&&tk.sp)xx+=r.l.sw;c.font=tk.hi?fH:fN;c.fillStyle=T.text;c.fillText(tk.t,xx,yy+lh/2);xx+=tk.w});yy+=lh});
   B.body=[x,y,x+mw,yy]}}
 // Unterschrift: freie Fläche, Linie, Name
 {const p=S.pos.sign,s=p.s,x=p.x/100*W,y=p.y/100*H,LW=.40*W*s,nm=(S.tx.signName||'').trim(),rl=(S.tx.signRole||'').trim(),fs=.021*W*s;
  c.fillStyle=T.line;c.fillRect(x,y-.8*u,LW,1.6*u);
  let yy=y+.012*W*s,bot=y+4*u;c.textAlign='left';c.textBaseline='top';
  if(nm){c.font=F2(fB,fs,700);c.fillStyle=T.text;c.fillText(nm,x,yy);yy+=fs*1.35;bot=yy}
  if(rl){c.font=F2(fB,fs*.85,400);c.fillStyle=T.text;c.fillText(rl,x,yy);yy+=fs*1.2;bot=yy}
  B.sign=[x,y-.12*W*s,x+LW,bot+4*u]}
 // Logo: kleines Drahtgitter-Dreieck mit Text
 {const p=S.pos.logo,s=p.s,cx=p.x/100*W,cy=p.y/100*H,r=.052*W*s,rb=ribbonTriangle(160),pr=q=>[q[0],q[1]];
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  drawMesh(c,rb,.62,6,q=>q,q=>[cx+q[0]*r/2.4,cy-q[1]*r/2.4],T.logo,Math.max(.5,.55*u),true,low);
  c.restore();
  const L=lines(S.tx.logo),fs=.0105*W*s;
  if(L.length){c.font=F2(fB,fs,700);c.fillStyle=T.logoTx;c.textAlign='center';c.textBaseline='middle';L.forEach((l,i)=>c.fillText(l,cx,cy+(i-(L.length-1)/2)*fs*1.3))}
  B.logo=[cx-r,cy-r,cx+r,cy+r]}
 // Fußzeile
 {const p=S.pos.foot,t=(S.tx.foot||'').trim(),fs=.0125*W*p.s,x=p.x/100*W,y=p.y/100*H;
  if(t){c.font=F2(fB,fs,400);c.fillStyle=T.foot;c.textAlign='left';c.textBaseline='alphabetic';c.fillText(t,x,y);B.foot=[x,y-fs,x+c.measureText(t).width,y+fs*.3]}}
 if(sel&&B[sel]){const[a,b,d,e]=B[sel],m=8*u;c.save();c.strokeStyle='#e5484d';c.lineWidth=Math.max(1.5,2*u);c.setLineDash([8*u,6*u]);c.strokeRect(a-m,b-m,d-a+2*m,e-b+2*m);c.restore()}
 return B;
}

//#CORE-END

const cv=$('#cv');let boxes={},lowT=null;
function render(low){
 const r=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||560;cv.width=Math.round(w*r);cv.height=Math.round(w*r*1.41421);
 boxes=draw(cv.getContext('2d'),cv.width,cv.height,adv.open?S.sel:null,!!low);save();
}
// Während des Ziehens grob zeichnen, danach in voller Dichte
function fast(){render(true);clearTimeout(lowT);lowT=setTimeout(()=>render(false),160)}
const msg=t=>$('#msg').textContent=t;
const ELS=[
 ['title','Titel',[['title','Titel (Zeilenumbruch = neue Zeile, wird auf die Spalte eingepasst)',2]]],
 ['sub','Untertitel',[['sub','Untertitel',1]]],
 ['name','Name',[['name','Name der Person (Zeilenumbruch = neue Zeile)',2]]],
 ['body','Text',[['date','Datum / Zeitraum',1],['event','Veranstaltung',1],['thema','Thema',1],['focus','Schwerpunkte, einer pro Zeile',4],['free','Eigener Text (optional, ersetzt den Satz; *Wort* wird fett)',4]]],
 ['sign','Unterschrift',[['signName','Name der unterschreibenden Person',1],['signRole','Funktion (optional)',1]]],
 ['logo','Logo',[['logo','Text im Logo',2]]],
 ['foot','Fußzeile',[['foot','Text',1]]],
 ['ribA','Band 1',[]],['ribB','Band 2',[]],['ribC','Band 3 (blau)',[]]];
function panel(){
 $('#chips').innerHTML='';ELS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=S.sel===k?'on':'';b.onclick=()=>{S.sel=k;panel();render()};$('#chips').append(b)});
 const el=ELS.find(e=>e[0]===S.sel),box=$('#fields');box.innerHTML='';
  const rib=S.sel.slice(0,3)==='rib',p=S.pos[S.sel];
 [['x',rib?'Verschieben ↔':'Waagerecht',rib?-60:0,rib?60:100,.1],['y',rib?'Verschieben ↕':'Senkrecht',rib?-60:0,rib?60:100,.1],['s','Größe',rib?.4:.3,rib?1.8:2.5,.01]].forEach(([k,l,mn,mx,st])=>{
  const d=document.createElement('div');d.className='sl';d.innerHTML='<span>'+l+'</span><input type="range" min="'+mn+'" max="'+mx+'" step="'+st+'"><output></output>';
  const i=d.querySelector('input'),o=d.querySelector('output');i.value=p[k];o.textContent=(+p[k]).toFixed(k==='s'?2:1);i.oninput=()=>{p[k]=+i.value;o.textContent=(+i.value).toFixed(k==='s'?2:1);fast()};box.append(d)});
 const h=document.createElement('div');h.className='hint';
 h.textContent=rib?'Drahtgitter-Band: lässt sich auch direkt in der Vorschau ziehen. Die Farbe stellst du unter „Gestaltung“ ein.':S.sel==='sign'?'Über der Linie bleibt Platz zum Unterschreiben. Du kannst das Element auch direkt in der Vorschau anklicken und ziehen.':'Du kannst das Element auch direkt in der Vorschau anklicken und ziehen.';
 box.append(h);
}
const TXT=[['title','Titel',2],['sub','Untertitel',1],['name','Name',2],['date','Datum oder Zeitraum',1],['event','Veranstaltung',1],['thema','Thema',1],['focus','Schwerpunkte (einer pro Zeile)',4],['free','Eigener Text (optional)',3,'Ersetzt den automatischen Satz. Mit *Sternchen* wird ein Wort fett.'],['signName','Name für die Unterschrift',1],['signRole','Funktion (optional)',1],['logo','Logo-Text',2],['foot','Fußzeile',2]];
const SELK={date:'body',event:'body',thema:'body',focus:'body',free:'body',signName:'sign',signRole:'sign'};
function buildTexts(){const box=$('#texts');box.innerHTML='';TXT.forEach(([k,l,rows,h])=>{const lb=document.createElement('label');lb.className='l';lb.textContent=l;const t=rows>1?document.createElement('textarea'):document.createElement('input');if(rows>1)t.rows=rows;else t.type='text';t.value=S.tx[k];t.oninput=()=>{S.tx[k]=t.value;render()};t.onfocus=()=>{S.sel=SELK[k]||k;if(adv.open)panel();render()};box.append(lb,t);if(h){const d=document.createElement('div');d.className='hint';d.textContent=h;box.append(d)}})}
function ctl(){
 $('#cols').innerHTML='';for(const k in CL){const l=document.createElement('label');l.append(CL[k]);const i=document.createElement('input');i.type='color';i.value=S.th[k];i.oninput=()=>{S.th[k]=i.value;fast()};l.append(i);$('#cols').append(l)}
 $('#fT').value=S.fT;$('#fB').value=S.fB;$('#fmt').value=S.fmt;
}
$('#fT').onchange=e=>{S.fT=e.target.value;render()};$('#fB').onchange=e=>{S.fB=e.target.value;render()};
$('#fmt').onchange=e=>{S.fmt=e.target.value;save()};
$('#bReset').onclick=()=>{if(!confirm('Alle Eingaben und Positionen zurücksetzen?'))return;S=DEF();buildTexts();ctl();panel();render()};

// Ziehen in der Vorschau (Text: Position, Bänder: Verschiebung)
let drag=null;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
cv.addEventListener('pointerdown',e=>{if(!adv.open)return;const[fx,fy]=pt(e),px=fx*cv.width,py=fy*cv.height,order=['foot','logo','sign','body','name','sub','title','ribC','ribB','ribA'];
 const k=order.find(k=>boxes[k]&&px>=boxes[k][0]&&px<=boxes[k][2]&&py>=boxes[k][1]&&py<=boxes[k][3]);
 if(!k)return;cv.setPointerCapture(e.pointerId);S.sel=k;const p=S.pos[k];
 drag={k,rib:k.slice(0,3)==='rib',fx,fy,x0:p.x,y0:p.y};panel();render()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[fx,fy]=pt(e),p=S.pos[drag.k];
 p.x=Math.round((drag.x0+(fx-drag.fx)*100)*10)/10;p.y=Math.round((drag.y0+(fy-drag.fy)*100)*10)/10;
 if(!drag.rib){p.x=Math.min(100,Math.max(0,p.x));p.y=Math.min(100,Math.max(0,p.y))}
 document.querySelectorAll('#fields .sl').forEach((d,i)=>{if(i<2){const v=i?p.y:p.x;d.querySelector('input').value=v;d.querySelector('output').textContent=v.toFixed(1)}});fast()});
['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>{drag=null}));

// Export
async function fonts(){try{await Promise.all([document.fonts.load('400 40px "Atkinson Hyperlegible"'),document.fonts.load('700 40px "Atkinson Hyperlegible"'),document.fonts.load('400 40px "Archivo Black"'),document.fonts.load('700 40px "IBM Plex Sans"'),document.fonts.load('400 40px "IBM Plex Sans"')])}catch(e){}}
function page(){const W={a5:1748,a4:2480,a3:3508}[S.fmt],H=Math.round(W*1.41421),c=document.createElement('canvas');c.width=W;c.height=H;draw(c.getContext('2d'),W,H,null,false);return c}
async function saveFile(name,blob){
 let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});msg('Gespeichert: '+name)}catch(e){msg(e&&e.code==='declined'?'Abgebrochen.':'Speichern nicht möglich.')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg('Datei erstellt: '+name);
}
const fileBase=()=>'kompetenznachweis-'+((S.tx.name||'').trim().split('\n')[0].toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-+|-+$/g,'')||'person');
$('#bPdf').onclick=async()=>{
 if(!(window.jspdf&&window.jspdf.jsPDF)){msg('PDF-Bibliothek nicht geladen (Internetverbindung?).');return}
 const b=$('#bPdf');b.disabled=true;msg('PDF wird erstellt …');
 try{await fonts();const f=S.fmt,sz={a5:[148,210],a4:[210,297],a3:[297,420]}[f],doc=new window.jspdf.jsPDF({unit:'mm',format:[sz[0],sz[1]],orientation:'portrait'});
  doc.addImage(page().toDataURL('image/jpeg',.95),'JPEG',0,0,sz[0],sz[1]);
  await saveFile(fileBase()+'-'+f+'.pdf',doc.output('blob'))}
 catch(e){console.error(e);msg('PDF konnte nicht erstellt werden.')}
 b.disabled=false};
$('#bPng').onclick=async()=>{await fonts();page().toBlob(bl=>saveFile(fileBase()+'.png',bl),'image/png')};

addEventListener('resize',()=>render());
buildTexts();ctl();panel();render();cv.style.cursor='default';adv.addEventListener('toggle',()=>{cv.style.cursor=adv.open?'grab':'default';panel();render()});
(document.fonts&&Promise.all([document.fonts.load('400 40px "Atkinson Hyperlegible"'),document.fonts.load('700 40px "IBM Plex Sans"')]).then(()=>render()).catch(()=>{}));
</script>
</body>
